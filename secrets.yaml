# The Secret Catalog (ADR 0003, Amendment 2026-10-06; CONTEXT.md). Every
# Secret the operator owns is listed here, keyed <namespace>/<name>, with its
# encrypted manifest and, for each key, where the value comes from. It holds no
# secret value. `kluster secrets` reads it; `kluster secrets --help` lists the
# commands.
#
# A key has one kind:
#
#   generated  random, alphanumeric, made by kluster   length (default 40)
#   issued     from a provider, through Bitwarden      item + field | attachment,
#                                                      rehearsalItem (optional)
#   copy       another key's value                     from: <ns>/<name>.<key>,
#                                                      format with {value} (optional)
#   literal    a value that is not secret but must     value
#              be inside a Secret
#
# A copy is written in the same step as its source, so a rotation cannot leave
# one behind. Each Secret's file is <name>.enc.yaml; only `data` is encrypted
# (.sops.yaml) and kluster writes `data`, never `stringData`.
#
# Generated values are alphanumeric on purpose: they go into argv
# (`redis-server --requirepass`), into hand-built connection strings and into
# URLs, where `/`, `+`, `=` and `@` have each broken something here before.
# kluster writes no trailing newline (redis, 2026-09-21: a 41-byte password).
#
# A rehearsal never gets a live value (ADR 0009, Amendment 2026-10-22). The
# services seed makes every Secret in a rehearsal namespace fresh, in memory:
# generated keys new, copies of those, literals as written. An issued key has
# no rehearsal value unless it names a `rehearsalItem:`, a Bitwarden item that
# holds a token made for rehearsals only (Amendment 2026-10-24); the seed reads
# it and writes it to no file. Otherwise its Secret carries `rehearsal: omit`
# and the reason in its note; `kluster services check` refuses one that does
# neither, and the catalog refuses a rehearsalItem that is the live item.

secrets:
  redis/redis:
    file: core/redis/redis.enc.yaml
    note: |
      Read by deployment.yaml through secretKeyRef for --requirepass. Nothing
      watches it for redis itself; Reloader restarts the readers.
      Check a stored length in the pod, never by base64 length (40 and 41
      bytes both encode to 56 characters):
        kubectl exec -n redis deploy/redis -- sh -c 'printf "%s" "$REDIS_PASSWORD" | wc -c'
    keys:
      password:
        kind: generated
        note: authos/credentials.REDIS_PASS is a copy (authos-api and duster).

  pg-cluster/db-credentials:
    file: core/cnpg/db-credentials.enc.yaml
    type: kubernetes.io/basic-auth
    labels:
      # 🔴 What makes a password ROTATION take effect: CloudNativePG reconciles
      # a Secret change only when the Secret is owned by a Cluster or carries
      # this label (cluster_predicates.go, hasReloadLabelSet). Without it the
      # bootstrap still works, and a rotation silently keeps the old password.
      cnpg.io/reload: "true"
    note: |
      pg-cluster.yaml spec.bootstrap.initdb.secret.name. The password of the
      `tosak` role, which owns every project database (ADR 0007). Both keys
      must exist: the initdb Job mounts `username` with Optional: false.
      (CloudNativePG v1.30.0 source.)
    keys:
      username:
        kind: literal
        value: tosak
        note: |
          🔴 Must equal initdb.owner, or the instance manager fails with
          "wrong username '<x>' in secret, expected '<y>'".
      password:
        kind: generated
        note: Copied into authos/credentials.DB_PASS and doma/credentials.DATABASE_URL.

  cert-manager/cloudflare-dns-token:
    file: core/cert-manager/cloudflare-dns-token.enc.yaml
    rehearsal: omit
    note: |
      The DNS-01 solver of the letsencrypt-prod ClusterIssuer (ADR 0008).
      Rehearsal: omitted; its issuer is self-signed and solves nothing.
    keys:
      api-token:
        kind: issued
        item: kluster/cloudflare-dns
        field: api_token
        note: |
          Scope Zone:DNS:Edit on tosak.net and nothing else. It cannot change
          zone settings (AOP, gRPC).

  argocd/argocd-notifications-secret:
    file: core/argocd/argocd-notifications-secret.enc.yaml
    rehearsal: omit
    note: |
      The one Secret in `argocd` that nothing creates for itself:
      argocd-values.yaml sets notifications.secret.create: false, so the
      render does not emit it. The other three Secrets there are not the
      operator's: `argocd-secret` (rendered empty; argocd-server writes
      server.secretkey; 🔴 setting any configs.secret.* value makes a
      re-apply wipe it), `argocd-redis` (made by a Job) and
      `argocd-initial-admin-secret` (disposable; deleting it does not change
      the admin password).
      Rehearsal: omitted; the notifications controller runs 0 replicas there.
    keys:
      github-token:
        kind: issued
        item: kluster/argocd-github
        field: github_token
        note: |
          Fine-grained PAT, single repository stevetosak/hetzner-cloud-infra,
          Contents: Read and write (what POST /dispatches needs). Not the
          APP_DEPLOY_PAT Actions secret, which carries Deployments: write on
          the application repositories.

  pg-cluster/r2-backup-credentials:
    file: core/cnpg/r2-backup-credentials.enc.yaml
    note: |
      The ARCHIVE store's token (objectstore.yaml): Object Read & Write on
      `tosak-pg-backups` ONLY (ADR 0003, 2026-10-01). Read by the
      barman-cloud sidecar in every PostgreSQL pod, so it must not reach the
      Terraform state bucket and must not carry bucket-configuration
      permission: the WAL lock is the one thing the cluster cannot undo. A
      restore after a total loss needs it first.
      Rehearsal: the rehearsal item, Object Read & Write on
      `tosak-pg-backups-rehearsal` ONLY, the bucket core/rehearsal/cnpg
      archives to (ADR 0009, Amendment 2026-10-24). It cannot list the live
      bucket.
    keys:
      ACCESS_KEY_ID:
        kind: issued
        item: kluster/r2-backup
        field: access_key_id
        rehearsalItem: kluster/r2-backup-rehearsal-rw
        note: 32 characters.
      ACCESS_SECRET_KEY:
        kind: issued
        item: kluster/r2-backup
        field: secret_access_key
        rehearsalItem: kluster/r2-backup-rehearsal-rw
        note: 64 characters.

  pg-cluster/r2-source-credentials:
    file: core/cnpg/r2-source-credentials.enc.yaml
    note: |
      The SOURCE store's token (source-objectstore.yaml): Object Read on
      `tosak-pg-backups`. Every recovery reads the live backups through it,
      in every environment, so a recovery cannot write the generation it
      reads (ADR 0009, Amendment 2026-10-24). `kluster db create` lists the
      bucket with the same token for the generation gate.
      🔴 Live: the same token as pg-drill/r2-readonly-credentials and the
      outside watcher's R2_READONLY_* repo secrets: rotate all three
      together.
      Rehearsal: the rehearsal item, a token of its own with the same scope
      (Read on `tosak-pg-backups`); no live value reaches a rehearsal.
    keys:
      ACCESS_KEY_ID:
        kind: issued
        item: kluster/r2-readonly
        field: access_key_id
        rehearsalItem: kluster/r2-backup-rehearsal-ro
      ACCESS_SECRET_KEY:
        kind: issued
        item: kluster/r2-readonly
        field: secret_access_key
        rehearsalItem: kluster/r2-backup-rehearsal-ro

  pg-drill/r2-drill-results-credentials:
    file: core/pg-drill/r2-drill-results-credentials.enc.yaml
    note: |
      R2 token, Object Read & Write on `tosak-drill-results` ONLY. drill.sh
      writes one result object per run, which the outside watcher reads. It
      must not reach `tosak-pg-backups`.
    keys:
      ACCESS_KEY_ID:
        kind: issued
        item: kluster/r2-drill-results
        field: access_key_id
      ACCESS_SECRET_KEY:
        kind: issued
        item: kluster/r2-drill-results
        field: secret_access_key

  pg-drill/r2-readonly-credentials:
    file: core/pg-drill/r2-readonly-credentials.enc.yaml
    note: |
      R2 token, Object Read on `tosak-pg-backups` and `tosak-drill-results`.
      🔴 The SAME token the outside watcher holds as the R2_READONLY_* repo
      secrets, and pg-cluster/r2-source-credentials: rotate all three
      together. Read by the drill's barman-cloud sidecar
      (objectstore.yaml) and by drill.sh, which lists the WAL. It cannot
      write, so a fault in the drill cannot touch the backups.
    keys:
      ACCESS_KEY_ID:
        kind: issued
        item: kluster/r2-readonly
        field: access_key_id
      ACCESS_SECRET_KEY:
        kind: issued
        item: kluster/r2-readonly
        field: secret_access_key

  pg-drill/telegram:
    file: core/pg-drill/telegram.enc.yaml
    note: |
      The infra Telegram bot; the drill reports on pass and on fail.
      🔴 The same values as the INFRA_TELEGRAM_BOT_TOKEN and
      INFRA_TELEGRAM_CHAT_ID repo secrets: rotate the token in both places.
    keys:
      BOT_TOKEN:
        kind: issued
        item: kluster/telegram-infra
        field: bot_token
      CHAT_ID:
        kind: issued
        item: kluster/telegram-infra
        field: chat_id

  authos/credentials:
    file: projects/authos/api/manifests/credentials.enc.yaml
    note: |
      Read by authos-api (envFrom) and by duster (REDIS_PASS, as
      REDIS_PASSWORD). DB_USER is not here: it is not secret and lives in the
      authos-api ConfigMap.
    keys:
      DB_PASS:
        kind: copy
        from: pg-cluster/db-credentials.password
      REDIS_PASS:
        kind: copy
        from: redis/redis.password

  authos/keystore:
    file: projects/authos/api/manifests/keystore.enc.yaml
    note: |
      authos-api mounts it at /etc/keystore/keystore.p12 with
      subPath: keystore.p12, so the key name is load-bearing. It must hold
      two aliases, or CryptoConfig.kt stops the API at boot:
        authos-jwt-sign             RSA key + certificate that sign ID tokens
        authos-credentials-encrypt  the key that encrypts stored credentials
      🔴 Losing it invalidates every token Authos issued and every credential
      it encrypted. Check the pair before storing it:
        keytool -list -keystore <file> -storetype PKCS12
    keys:
      keystore.p12:
        kind: issued
        item: kluster/authos-keystore
        attachment: keystore.p12

  authos/keystore-pass:
    file: projects/authos/api/manifests/keystore-pass.enc.yaml
    note: The password of authos/keystore; authos-api reads it through envFrom.
    keys:
      KEYSTORE_PASS:
        kind: issued
        item: kluster/authos-keystore
        field: keystore_pass

  authos/duster-admin:
    file: projects/authos/duster/manifests/duster-admin.enc.yaml
    note: |
      Bearer token for Duster's /duster/api/v1/internal/* API (app registry,
      CLI credentials). Unset, Duster fails closed: every internal call is 401.
    keys:
      DUSTER_ADMIN_TOKEN:
        kind: generated
        length: 64
        note: dstr and authos-demo/scripts/bootstrap.ts must use the same value.

  doma/credentials:
    file: projects/doma/web/manifests/credentials.enc.yaml
    keys:
      DATABASE_URL:
        kind: copy
        from: pg-cluster/db-credentials.password
        format: postgresql://tosak:{value}@tosak-pg-cluster-rw.pg-cluster.svc.cluster.local:5432/doma
      SESSION_SECRET:
        kind: generated
        length: 64
      GOOGLE_CLIENT_SECRET:
        kind: issued
        item: kluster/doma
        field: google_client_secret
      TELEGRAM_BOT_TOKEN:
        kind: issued
        item: kluster/doma
        field: telegram_bot_token
        note: "@domche_bot (named in configmap.yaml). Blank, the bot never starts."
      TELEGRAM_WEBHOOK_SECRET:
        kind: generated
        length: 64
        note: |
          🔴 Not optional once the bot token is set. It is the only
          authentication on a public POST endpoint (/api/telegram/webhook):
          grammy skips the X-Telegram-Bot-Api-Secret-Token check when it is
          empty, and boot then CLEARS the secret registered with Telegram
          (src/core/notify/telegram-bot.ts). Telegram accepts A-Z a-z 0-9 _ -.
