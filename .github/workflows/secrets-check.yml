# Proves every *.enc.yaml is listed in secrets.yaml and fully encrypted, with
# `kluster secrets check` (ADR 0003, Amendment 2026-10-06). The pre-commit hook
# runs the same check on the staged files; this job catches a clone that never
# enabled the hook. It needs no key and no sops: it reads the files only.
#
# 🔴 This repository is public. A failed check names files and keys, never a value.
name: Secrets check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/kluster/go.mod
          cache-dependency-path: tools/kluster/go.sum
      - name: kluster secrets check
        working-directory: tools/kluster
        run: go run . secrets check
      - name: catalog, sops and secrets tests
        working-directory: tools/kluster
        run: go test ./internal/catalog ./internal/sops ./internal/secrets
