# kluster configuration. COMMITTED on purpose.
#
# This file is the only written record of the VPN topology — the hub address,
# the port, and which public keys may join. The previous cluster's CNI choice
# survived nowhere and had to be re-decided from scratch after the loss
# (ADR 0001). A topology that exists only on one laptop is the same exposure.
#
# It holds no secret. Public keys are public, and the Hetzner token lives in
# infra/.envrc, which stays gitignored.
#
# kluster is a convenience over Terraform and the runbook, never the authority
# (ADR 0004). Per-worker addresses are NOT here: a worker's identity — its
# name, its private address, its VPN address — is declared once, in
# infra/workers/terraform.tfvars.

controlPlane:
  privateIP: "10.0.1.5"
  vpnIP: "10.100.0.1"
  # The cluster's own name for its API server. Every node resolves it to
  # privateIP from its own /etc/hosts; the laptop deliberately does not resolve
  # it and uses vpnIP instead. See ADR 0006.
  endpoint: "k8s-cp.tosak.internal"
  sshUser: cp-dev

node:
  sshUser: root
  user: tosak
  networkInterface: enp7s0

wireguard:
  subnet: "10.100.0.0/24"
  port: 51820
  peers:
    - name: admin-laptop
      publicKey: "7v0/KwZNn08j5rtN8IQ2C8f9kOeuEqKEIlWwr4Qhq00="
      allowedIPs: "10.100.0.69/32"

versions:
  containerd: "2.2.0"
  runc: "1.4.0"
  kubernetes: "v1.37"

terraform:
  # One path per root Module, relative to this file (ADR 0002: three Modules,
  # each with its own state). kluster never plans more than one at a time.
  modules:
    shared: ../../infra/shared
    control-plane: ../../infra/control-plane
    workers: ../../infra/workers

# Where kluster acts. `--env` picks one; live is the default (ADR 0009).
#
# Only the NAMES of environment variables are here. kluster reads the values
# from its own environment and hands the terraform child process a clean one:
# no TF_VAR_*, AWS_* or HCLOUD_* from the shell reaches it, so a rehearsal run
# can never carry the live token.
envs:
  live:
    hcloudTokenEnv: TF_VAR_HCLOUD_TOKEN
    r2AccessKeyIDEnv: AWS_ACCESS_KEY_ID
    r2SecretAccessKeyEnv: AWS_SECRET_ACCESS_KEY
    # Empty: the bucket in each Module's backend.tf.
    stateBucket: ""
  rehearsal:
    hcloudTokenEnv: KLUSTER_REHEARSAL_HCLOUD_TOKEN
    r2AccessKeyIDEnv: KLUSTER_REHEARSAL_R2_ACCESS_KEY_ID
    r2SecretAccessKeyEnv: KLUSTER_REHEARSAL_R2_SECRET_ACCESS_KEY
    # Its own bucket and a token scoped to it alone, so a rehearsal run holds no
    # credential that can write live state (ADR 0009, Amendments).
    stateBucket: hetzner-cloud-infra-rehearsal
    # The live Control Plane's public address. A rehearsal run refuses a
    # project that holds it: that would be the live project under the wrong
    # name.
    refuseProjectWithIP: "46.62.209.249"

ssh:
  # The private half of the `tosak-cluster` key in shared/. Empty: use the
  # running ssh-agent.
  identityFile: ""
