# The data zone: a Deployment that uses the platform's PostgreSQL prefers the
# site of the database's primary, because every query pays the round trip
# (ADR 0016, Placement follows the profile; Amendment 2026-11-23).
#
# The preference names no site. It follows the pod that holds the primary role,
# with the site label kluster writes as the topology key, so it moves with the
# data when the primary moves, to another Node or to another site. It is a
# preference only: with no room at that site, the pod still starts elsewhere.
# It acts only when a pod is scheduled; a running pod stays where it is after
# a failover.
#
# An overlay takes it with `components: [<path to this directory>]`; it
# patches every Deployment of that overlay.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: any
      spec:
        template:
          spec:
            affinity:
              podAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          cnpg.io/cluster: tosak-pg-cluster
                          cnpg.io/instanceRole: primary
                      namespaces: ["pg-cluster"]
                      topologyKey: tosak.net.node-restriction.kubernetes.io/site
