# The CA that the Gateway trusts for client certificates (ADR 0008): the
# trust anchor of the origin lock, read by `client-traffic-policy.yaml`.
#
# Cloudflare presents a leaf signed by this CA on every connection to the
# origin (zone-level Authenticated Origin Pulls, our own certificate). The CA
# is ours, not Cloudflare's shared origin-pull certificate, which is the same
# for every Cloudflare customer.
#
# Public on purpose: a CA certificate is not a secret. Both private keys are in
# Bitwarden (`kluster/cloudflare-aop-ca`, `kluster/cloudflare-aop-leaf`).
# CA valid to 2036-10-22, leaf to 2028-10-24. A renewal signs a new leaf with
# this CA and uploads it to Cloudflare; this file does not change.
