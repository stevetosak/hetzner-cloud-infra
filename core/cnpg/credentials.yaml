# Template only — the real Secret is created out of band and its value is never
# committed. Same convention as core/cert-manager/credentials.yaml and every
# projects/*/manifests/credentials.yaml.
#
# This is the Secret named by `pg-cluster.yaml` at
# `spec.bootstrap.initdb.secret.name`. It holds the password of the `tosak`
# role, which owns every project database (ADR 0007).
#
# Create it with:
#
#   kubectl create secret generic db-credentials \
#     --namespace pg-cluster \
#     --type kubernetes.io/basic-auth \
#     --from-literal=username=tosak \
#     --from-file=password=<path to a file holding the password>
#   kubectl label secret db-credentials --namespace pg-cluster cnpg.io/reload=true
#
# Three things about the shape are load-bearing. Each was read out of the
# CloudNativePG v1.30.0 source, not assumed:
#
#  1. 🔴 `username` MUST be `tosak`, matching `initdb.owner`. The instance
#     manager compares the two and fails with `wrong username '<x>' in secret,
#     expected '<y>'` (internal/management/controller/instance_controller.go).
#
#  2. 🔴 Both keys MUST exist. The initdb Job mounts `username` with
#     `Optional: false` (pkg/specs/jobs.go), so a Secret missing it stops the
#     bootstrap before PostgreSQL ever starts.
#
#  3. 🔴 The `cnpg.io/reload=true` label is NOT decoration — it is what makes a
#     password ROTATION take effect. The operator reconciles on a Secret change
#     only when that Secret is owned by a Cluster or carries this label
#     (internal/controller/cluster_predicates.go, `hasReloadLabelSet`).
#     CloudNativePG sets it on every Secret it creates itself. A hand-made
#     Secret without it still bootstraps correctly, because the Secret is read
#     uncached at that moment — so the omission is INVISIBLE until the day
#     someone edits the password and PostgreSQL silently keeps the old one.
#
# The `kubernetes.io/basic-auth` type is what CloudNativePG uses for the Secrets
# it generates. The code checks only that the two keys exist, so the type is
# convention rather than a requirement — it is set to match.
#
# Phase 5 owes this Secret a `credentials.enc.yaml` encrypted with age: a secret
# recreated without being encrypted into git has not been restored (ADR 0003).
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: pg-cluster
  labels:
    cnpg.io/reload: 'true'
type: kubernetes.io/basic-auth
stringData:
  username: tosak
  password: ''
