apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tosak-pg-cluster
  namespace: pg-cluster
spec:
  instances: 3

  # PostgreSQL 18.6. Pinned, like every other version in this repository.
  #
  # The operator supplies a default when this is unset — 1.30.0's is this exact
  # tag (pkg/versions/versions.go, `DefaultImageName`). Leaving it unset would
  # mean the PostgreSQL major version of a cluster built from this repository is
  # decided by whichever operator version is current on the day it is built,
  # which is not reproducible. CloudNativePG refuses a major-version change on a
  # running cluster, so the unpinned failure arrives as a rebuild that quietly
  # comes up on a different major, not as a corrupted upgrade.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie

  bootstrap:
    initdb:
      # The database is Authos's own. The owner role is NOT — it owns doma,
      # wasteio and imaps too, so it carries the organisation name (ADR 0007).
      database: authos
      owner: tosak
      secret:
        name: db-credentials

  storage:
    # Longhorn is gone (ADR 0005). PostgreSQL is the reason the rebuild moved
    # to Hetzner Volumes: a Volume outlives the server that mounts it, so
    # destroying every Worker no longer destroys the data.
    #
    # 10Gi per instance, three instances — the figure ADR 0005 costed at about
    # EUR 1.32/month. It was 5Gi here, which did not match the decision.
    size: 10Gi
    # Retain, not the default class's Delete (ADR 0003, Amendments 2026-10-01).
    # The three PVCs created before this line still name `hcloud-volumes` —
    # CloudNativePG does not migrate existing PVCs — so their PVs were patched
    # to Retain by hand. That mismatch is expected.
    storageClass: hcloud-volumes-retain

  # WAL archiving and base backups to R2, through the barman-cloud CNPG-I
  # plugin (core/cnpg/plugin-barman-cloud.yaml, objectstore.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: tosak-pg-backups
        # The archive path's generation. A real recovery READS this one and
        # ARCHIVES to the next (-g2): CloudNativePG refuses to archive into a
        # non-empty path, the cluster must keep its name because every app
        # addresses tosak-pg-cluster-rw, and the bucket lock means an old path
        # cannot be cleared. Bump it here when a recovery happens.
        serverName: tosak-pg-cluster-g1

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"

