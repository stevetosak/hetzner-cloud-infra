# The VerticalPodAutoscaler objects of the workloads of CloudNativePG: the operator, the barman-cloud plugin and the
# database Cluster (the Cluster owns its pods directly) (ADR 0014).
# updateMode Off: the recommender writes a recommendation and nothing changes.
# RequestsOnly: VPA sets requests, never limits. minAllowed is the ADR 0013
# floor (10m, 32Mi), higher where ADR 0014 names one (PostgreSQL, Envoy).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cnpg-controller-manager
  namespace: cnpg-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cnpg-controller-manager
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 32Mi}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: barman-cloud
  namespace: cnpg-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: barman-cloud
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 32Mi}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: tosak-pg-cluster
  namespace: pg-cluster
spec:
  targetRef:
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    name: tosak-pg-cluster
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: postgres
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 384Mi}
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 32Mi}
