# The VerticalPodAutoscaler objects of the workloads of CloudNativePG: the operator, the barman-cloud plugin and the
# database Cluster (the Cluster owns its pods directly) (ADR 0014).
# updateMode InPlaceOrRecreate: the updater resizes the running pod in place, and
# evicts it only when the node cannot fit the new request. The objects that stay
# Off say so (Autoscaling Plan, decisions of 2026-11-16).
# RequestsOnly: VPA sets requests, never limits. minAllowed is the ADR 0013
# floor (10m, 32Mi), higher where ADR 0014 names one (PostgreSQL, Envoy).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cnpg-controller-manager
  namespace: cnpg-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cnpg-controller-manager
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 32Mi}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: barman-cloud
  namespace: cnpg-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: barman-cloud
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 32Mi}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: tosak-pg-cluster
  namespace: pg-cluster
spec:
  targetRef:
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    name: tosak-pg-cluster
  # PostgreSQL stays Off and keeps its limits.
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: postgres
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 256Mi}
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 32Mi}
