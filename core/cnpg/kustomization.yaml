# Synced by the Application core-cnpg (ADR 0010, Amendment 2026-10-22).
# NOT listed, and never to be: namespace.yaml and crds.yaml (the seed), the
# *.enc.yaml Secrets (kluster secrets apply), cluster/ (`kluster db create`:
# a sync must never create or change the Cluster),
# databases/ of projects outside the generator (imaps, wasteio).
# `kluster services check` refuses a kustomization that names a *.enc.yaml,
# pg-cluster.yaml or cluster/, a values file, a crds.yaml or a Namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - operator.yaml
  - plugin-barman-cloud.yaml
  - storageclass-retain.yaml
  - objectstore.yaml
  - source-objectstore.yaml
  - scheduled-backup.yaml
  - databases/doma.yaml

# Sized by ADR 0013 from the 2026-11-01..05 peaks (Capacity Plan Snapshots 0
# and 1). Patches, because operator.yaml and plugin-barman-cloud.yaml are
# upstream text that render.sh writes again on an upgrade. Each `test` fails
# the build if upstream moves the container.
patches:
  - target:
      group: apps
      kind: Deployment
      name: cnpg-controller-manager
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: manager
      # Memory raised from 64Mi: the new pod held 81 MiB from its start
      # (ADR 0013 first-hour check, 2026-11-05).
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 112Mi
          limits:
            memory: 224Mi
  - target:
      group: apps
      kind: Deployment
      name: barman-cloud
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: barman-cloud
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
