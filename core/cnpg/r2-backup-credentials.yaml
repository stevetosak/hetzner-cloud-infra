# Template only — documents the shape. The real Secret is committed encrypted
# as r2-backup-credentials.enc.yaml and applied with scripts/secrets.sh
# (ADR 0003, Amendments 2026-10-01).
#
# An R2 API token with Object Read & Write on the bucket `tosak-pg-backups`
# ONLY. It is read by the barman-cloud sidecar in every PostgreSQL pod, so it
# must not reach `hetzner-cloud-infra` (terraform state) and must not carry
# bucket-configuration permission — the lock on the WAL prefix is the one thing
# the cluster cannot undo.
#
# R2 shows the pair once, when the token is created: the Access Key ID is 32
# characters and the Secret Access Key is 64. A copy lives in the password
# manager, because a restore after a total loss needs it before anything else.
apiVersion: v1
kind: Secret
metadata:
  name: r2-backup-credentials
  namespace: pg-cluster
type: Opaque
stringData:
  ACCESS_KEY_ID: ""
  ACCESS_SECRET_KEY: ""
