# Template only — the real Secret is created out of band and its value is never
# committed. Same convention as core/cnpg/credentials.yaml,
# core/cert-manager/credentials.yaml and every projects/*/manifests/credentials.yaml.
#
# This is the Secret `deployment.yaml` reads through `secretKeyRef`, to pass
# `--requirepass`. Until 2026-09-21 nothing in this repository created it, so
# applying the Deployment alone left the pod in `CreateContainerConfigError`
# with the cause named nowhere.
#
# Create it with:
#
#   LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 40 > <scratch file, mode 600>
#
#   kubectl create secret generic redis \
#     --namespace redis \
#     --from-file=password=<scratch file>
#
# `head -c 40` writes no trailing newline. Anything that does — `echo`, an
# editor that adds a final newline — produces a 41-byte password. See point 2.
#
# Three things about it are load-bearing:
#
#  1. 🔴 THE SAME VALUE LIVES IN A SECOND SECRET. `authos` reads Redis through
#     `credentials`/`REDIS_PASS` in its own namespace, and Duster reads that
#     same key (projects/authos/duster/manifests/base/deployment.yaml). Rotating
#     `redis`/`password` alone leaves both applications holding the old value
#     and failing with NOAUTH — in a namespace nothing here points at. Rotate
#     both, in the same step, always.
#
#  2. 🔴 NO TRAILING NEWLINE. `--from-file` stores the file BYTE FOR BYTE, so a
#     file written by anything that appends a newline makes the real password
#     41 bytes ending in `0a`. Redis accepts it and the pod goes Ready, because
#     both `--requirepass` and the readiness probe quote the variable. It
#     breaks later, when the 40 characters a human copied are written into the
#     second Secret and no longer match. This happened on 2026-09-21.
#
#     Verify the stored length, which is NOT visible in the base64:
#
#       kubectl get secret redis -n redis \
#         -o go-template='{{len .data.password}}'
#
#     🔴 That number is the BASE64 length and 40 and 41 bytes BOTH encode to
#     56 characters, so it proves nothing on its own. Check the decoded length
#     inside the running pod instead, which prints no value:
#
#       kubectl exec -n redis deploy/redis -- \
#         sh -c 'printf "%s" "$REDIS_PASSWORD" | wc -c'          # must be 40
#       kubectl exec -n redis deploy/redis -- \
#         sh -c 'printf "%s" "$REDIS_PASSWORD" | tr -d "A-Za-z0-9" | wc -c'   # must be 0
#
#  3. **Alphanumeric on purpose.** The password is passed as an argument to
#     `redis-server` and read back by `redis-cli -a`, and the applications build
#     their own connection strings by hand. `/`, `+`, `=` and `@` have broken
#     each of those in turn elsewhere in this repository. 40 characters from
#     that alphabet is about 238 bits.
#
# There is no `cnpg.io/reload` equivalent here: nothing watches this Secret.
# A password change needs `kubectl rollout restart deployment/redis -n redis`,
# and the consuming applications restarted too.
#
# Phase 5 owes this Secret a `credentials.enc.yaml` encrypted with age: a secret
# recreated without being encrypted into git has not been restored (ADR 0003).
apiVersion: v1
kind: Secret
metadata:
  name: redis
  namespace: redis
type: Opaque
stringData:
  password: ''
