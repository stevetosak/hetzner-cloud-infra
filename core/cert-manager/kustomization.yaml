# Synced by the Application core-cert-manager (ADR 0010, Amendment 2026-10-22).
# NOT listed, and never to be: namespace.yaml and crds.yaml (the seed),
# cloudflare-dns-token.enc.yaml (kluster secrets apply), cert-manager-
# values.yaml (render input).
# `kluster services check` refuses a kustomization that names a *.enc.yaml,
# pg-cluster.yaml, a values file, a crds.yaml or a Namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cert-manager.yaml
  - clusterissuer.yaml
