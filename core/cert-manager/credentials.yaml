# Template only — the real Secret is created out of band and its value is
# never committed. Same convention as every projects/*/manifests/credentials.yaml.
#
# Create it with:
#
#   kubectl create secret generic cloudflare-dns-token \
#     --namespace cert-manager \
#     --from-file=api-token=<path to a file holding the token, no trailing newline>
#
# Scope the token `Zone:DNS:Edit` on `tosak.net` and nothing else. It is one of
# the two credentials ADR 0008 adds; the other is the per-zone Cloudflare
# origin-pull certificate.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-dns-token
  namespace: cert-manager
type: Opaque
stringData:
  api-token: ''
