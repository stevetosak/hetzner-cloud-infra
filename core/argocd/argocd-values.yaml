# Values that produced core/argocd/argocd.yaml.
#
# Chart: oci://ghcr.io/argoproj/argo-helm/argo-cd, version 10.9.2,
# ArgoCD v3.5.3. Render with core/argocd/render.sh. Do not edit the rendered
# file.
#
# Every value below is here for a reason that is written next to it. The chart
# has about 4,900 lines of values; nothing else is overridden.
#
# 🔴 DO NOT SET `configs.secret.argocdServerAdminPassword`. The chart renders
# `admin.passwordMtime` from `now`, so that one value makes the rendered
# manifest different on every render and the commit diff meaningless. The
# initial admin password is generated by `argocd-server` into
# `argocd-initial-admin-secret` instead — see core/argocd/credentials.yaml.

crds:
  # The chart defaults are already `true` for both. They are repeated here
  # because they are load-bearing and because `keep: true` is what stops an
  # uninstall taking every Application object with it.
  #
  # 🔴 `applicationsets.argoproj.io` renders to about 23,000 lines. That is far
  # over the 256 KiB limit on the last-applied-configuration annotation, so
  # `kubectl apply --server-side` is mandatory here — the same constraint the
  # CloudNativePG operator has (step 9 of docs/runbook/cluster-services.md).
  install: true
  keep: true

global:
  # Sets `url: https://argocd.tosak.net` in `argocd-cm`, which ArgoCD uses to
  # build every link it emits, and it is the default for
  # `notifications.argocdUrl`. One subdomain level, per the DNS convention.
  domain: argocd.tosak.net

configs:
  params:
    # ADR 0008. TLS terminates at the Gateway, so `argocd-server` must serve
    # cleartext. If the two disagree the result is a redirect loop, which is
    # what the deleted Ingress's `backend-protocol: HTTPS` annotation avoided.
    #
    # This is also the switch that makes the h2c Service port below render at
    # all: the chart emits that port only when `server.insecure` is true,
    # because h2c is not applicable to a TLS backend.
    server.insecure: true

dex:
  # No SSO is configured, and none is planned in this phase. Dex with no
  # connector is a Deployment, a Service, two Secrets and a ServiceAccount that
  # do nothing. Local accounts and the `admin` user are unaffected.
  enabled: false

server:
  service:
    # 🔴 THIS IS TWO PORTS, NOT ONE, AND ADR 0008 SAYS ONE.
    #
    # ADR 0008 states that "the `argocd-server` Service port carries
    # `appProtocol: kubernetes.io/h2c`". Read literally that breaks the web UI,
    # and the chart cannot express it in any case:
    #
    #  1. There is no `servicePortHttpAppProtocol` value. The Service template
    #     can set `appProtocol` on the `http2` port and the `https` port only.
    #     Port 80 cannot carry it.
    #
    #  2. `argocd-server` splits the one container port with cmux, and the two
    #     matchers are exclusive (server/server.go, v3.5.3):
    #
    #       httpL = tcpm.Match(cmux.HTTP1Fast("PATCH"))
    #       grpcL = tcpm.MatchWithWriters(
    #           cmux.HTTP2MatchHeaderFieldSendSettings(
    #               "content-type", "application/grpc"))
    #
    #     The UI listener matches HTTP/1.x only. An h2c connection that is not
    #     gRPC matches NO listener and cmux drops it. So h2c on the only port
    #     would mean every browser request fails.
    #
    # The fix is a second Service port that advertises h2c, and an HTTPRoute
    # that sends gRPC there and everything else to port 80. ArgoCD's own
    # ingress documentation describes the same shape.
    #
    # All three Service ports target container port 8080. Port 443 is named
    # `https` and serves cleartext while `server.insecure` is true; the chart
    # always renders it and no value removes it. Nothing routes to it.
    servicePortHttp2: 8080
    servicePortHttp2AppProtocol: kubernetes.io/h2c

  # Modest requests and limits on every component, against the chart default of
  # none. ArgoCD is the control plane for every deploy in this cluster, and a
  # pod with no requests is BestEffort and so is evicted first. Two workers
  # already request 46% and 57% of their memory, and an unbounded
  # application-controller could push a node into memory pressure and take
  # CloudNativePG or Redis with it. Neither has a backup (Phase 6).
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

controller:
  # The application-controller is the heavy component: it holds the state of
  # every Application and every resource each one owns.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

repoServer:
  # Clones the infra repository and runs `kustomize build` on each overlay.
  # Bursty rather than steady.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

redis:
  # ArgoCD keeps its OWN Redis, and does not use the shared one in namespace
  # `redis`.
  #
  # The shared instance is a 384 MB session store running `volatile-lru`,
  # read by Authos and Duster. ArgoCD's cache is churn: pointing it at the
  # shared instance would make the two compete for the same 384 MB, and an
  # eviction caused by ArgoCD would surface as a logged-out user in another
  # namespace. This one is a cache with nothing else in it.
  #
  # 🔴 The chart runs this Redis with `--save '' --appendonly no` and NO
  # `--maxmemory`, so a memory limit alone would let it grow until the kernel
  # kills the container. That is the trap from step 11 of
  # docs/runbook/cluster-services.md: `maxmemory` bounds the dataset only, and
  # client buffers and fragmentation sit on top of it. 192mb of dataset against
  # a 256Mi limit leaves that headroom.
  #
  # `allkeys-lru` is right HERE and wrong for the shared instance. Everything
  # in this Redis is a cache that ArgoCD can rebuild from the cluster and the
  # git repository, so evicting a key without a TTL is correct. In a session
  # store it would log people out, which is why that one runs `volatile-lru`.
  extraArgs:
    - --maxmemory
    - 192mb
    - --maxmemory-policy
    - allkeys-lru
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

redisSecretInit:
  # One-shot Job. It generates the `argocd-redis` auth Secret, which is why
  # nothing in this repository has to create it.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

notifications:
  # The whole deploy-live notification configuration lives here, and no longer
  # in a tracked ConfigMap applied out of band. Until 2026-09-21 it sat in
  # `core/argocd/notifications/argocd-notifications-cm.yaml`, which was applied
  # over the ConfigMap the chart renders — so the rendered manifest held data
  # that was overwritten immediately, and re-applying the render silently
  # reverted the configuration. The chart exposes every key needed, so there is
  # one source of truth now.
  #
  # What this does: emit a GitHub `repository_dispatch` (`event_type:
  # deploy-live`) to stevetosak/hetzner-cloud-infra when an Application goes
  # Synced and Healthy on an image set it has not reported before.
  # `.github/workflows/deploy-catalog.yml` consumes it.

  # 🔴 The chart otherwise renders an EMPTY `argocd-notifications-secret` with a
  # `stringData:` key and nothing under it. The operator has to write the PAT
  # into that Secret, and a rendered empty Secret re-applied later is a way to
  # lose it. Nothing in this repository creates it either — see
  # core/argocd/credentials.yaml, which documents the shape. This is the same
  # gap `db-credentials` and the `redis` Secret both had.
  secret:
    create: false

  notifiers:
    service.webhook.gh-infra: |
      url: https://api.github.com/repos/stevetosak/hetzner-cloud-infra/dispatches
      headers:
        - name: Authorization
          value: token $github-token
        - name: Accept
          value: application/vnd.github+json
        - name: User-Agent
          value: argocd-notifications

  triggers:
    # 🔴 `oncePer` keys on the running image list, NOT on `sync.revision`.
    # Every Application tracks the infra repository unscoped, so
    # `sync.revision` advances for all of them on every infra commit and this
    # trigger would fire once per Application per deploy, into a workflow that
    # does not serialise. Keying on `summary.images` fires only for the
    # Application whose image actually changed, and it also absorbs a
    # Healthy -> Degraded -> Healthy flap.
    trigger.on-deployed: |
      - description: Application is synced and healthy. Triggered once per running image set.
        oncePer: app.status.summary.images
        when: >-
          app.status.operationState != nil and
          app.status.operationState.phase in ['Succeeded'] and
          app.status.health.status == 'Healthy' and
          app.status.sync.status == 'Synced'
        send: [app-deployed]

  templates:
    template.app-deployed: |
      webhook:
        gh-infra:
          method: POST
          body: |
            {
              "event_type": "deploy-live",
              "client_payload": {
                "app": "{{.app.metadata.name}}",
                "project": "{{.app.spec.project}}",
                "revision": "{{.app.status.sync.revision}}",
                "image": "{{if .app.status.summary.images}}{{index .app.status.summary.images 0}}{{end}}"
              }
            }

  # A global subscription, with no per-Application annotations. The
  # ApplicationSet migration therefore changes nothing here.
  subscriptions:
    - recipients:
        - gh-infra
      triggers:
        - on-deployed

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
