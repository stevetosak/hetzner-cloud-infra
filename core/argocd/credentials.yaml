# Template only — the real Secret is created out of band and its value is never
# committed. Same convention as core/redis/credentials.yaml,
# core/cnpg/credentials.yaml, core/cert-manager/credentials.yaml and every
# projects/*/manifests/credentials.yaml.
#
# This is the ONE Secret in the `argocd` namespace that nothing creates for
# itself. `argocd-values.yaml` sets `notifications.secret.create: false`, so
# the render does not emit it either. The same gap `db-credentials` and the
# `redis` Secret both had, and both cost a session to find.
#
# Create it with:
#
#   kubectl create secret generic argocd-notifications-secret \
#     --namespace argocd \
#     --from-literal=github-token=<FINE_GRAINED_PAT>
#
# `--from-literal` takes the value as given, with no trailing newline. Do NOT
# use `--from-file` with a file an editor wrote: `--from-file` stores the bytes
# exactly, and a trailing newline in a token is invisible to every obvious
# check. That happened to the `redis` Secret on 2026-09-21.
#
# ## The PAT
#
# Fine-grained, single repository `stevetosak/hetzner-cloud-infra`, permission
# **Contents: Read and write** — that is what `POST /dispatches` needs. It is a
# different token from the infra repository's `APP_DEPLOY_PAT` Actions secret,
# which carries **Deployments: write** on the application repositories.
#
# ## Why `create: false` and not a patch
#
# With `notifications.secret.create: true` the chart renders a Secret whose
# `stringData:` key has nothing under it, and the operator then patches the
# token into it. That works once. It puts a Secret in a generated file that a
# later `kubectl apply -f core/argocd/argocd.yaml` touches again, for no gain —
# so the Secret is simply not rendered.
#
# ## Three other Secrets exist in this namespace, and none of them belongs here
#
#  1. `argocd-secret` IS rendered, deliberately empty. `argocd-server` writes
#     `server.secretkey` into it at first start. The chart's own template
#     carries the warning: "Setting a blank data again will wipe admin
#     password/key/cert". It is safe here only because no `configs.secret.*`
#     value is set, so no `data:` block is rendered at all. 🔴 Set one and a
#     re-apply wipes the signing key, which logs every session out.
#
#  2. `argocd-redis` is created by the `argocd-redis-secret-init` Job.
#
#  3. `argocd-initial-admin-secret` is created by `argocd-server` at first
#     start, and holds the generated `admin` password. Read it once, log in,
#     and then delete it — ArgoCD treats it as disposable. 🔴 Deleting it does
#     NOT change the password.
#
# Phase 5 owes this Secret a `credentials.enc.yaml` encrypted with age: a
# secret recreated without being encrypted into git has not been restored
# (ADR 0003).
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
type: Opaque
stringData:
  github-token: ''
