# The rehearsal cut of core/argocd (ADR 0010, Amendment 2026-10-22,
# decision 14). In a rehearsal the Application core-argocd points here, so
# ArgoCD keeps the cut in place itself.
#
#   notifications controller   0 replicas: a rehearsal deploy must not send
#                              Telegram messages or write the deploy catalog.
#   projects ApplicationSet    the rehearsed projects only (ADR 0010,
#                              Amendment 2026-11-14), each from its overlay
#                              manifests/overlays/rehearsal, from the branch
#                              `rehearsal`. The seed makes their Namespaces
#                              and Secrets (rehearsalItem values); a project
#                              that is not listed does not run.
#   core ApplicationSet        the rehearsal list: limit-ranges out (it
#                              writes only into application namespaces),
#                              cert-manager, argocd, cnpg, monitoring,
#                              pg-drill and reloader pointed at their
#                              rehearsal cuts; and branch
#                              `rehearsal` instead of master, so a change is
#                              rehearsed before it merges. Put it there with
#                              `git push -f origin HEAD:rehearsal`.
#
# The core list below replaces the whole list in core-applicationset.yaml.
# Keep the two in step; `kluster services check` refuses a rehearsal element
# that is not in the main list, and a rehearsed project the projects
# generator does not list or that has no rehearsal overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../argocd
patches:
  - target:
      group: apps
      kind: Deployment
      name: argocd-notifications-controller
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      group: argoproj.io
      kind: ApplicationSet
      name: projects
    patch: |-
      - op: replace
        path: /spec/generators/0/git/directories
        value:
          - path: projects/mail/*/manifests/overlays/rehearsal
      - op: replace
        path: /spec/generators/0/git/revision
        value: rehearsal
      - op: replace
        path: /spec/template/spec/source/targetRevision
        value: rehearsal
  - target:
      group: argoproj.io
      kind: ApplicationSet
      name: core
    patch: |-
      - op: replace
        path: /spec/generators/0/list/elements
        value:
          - {dir: argocd, path: core/rehearsal/argocd, namespace: argocd}
          - {dir: cert-manager, path: core/rehearsal/cert-manager, namespace: cert-manager}
          - {dir: cnpg, path: core/rehearsal/cnpg, namespace: cnpg-system}
          - {dir: gateway, path: core/gateway, namespace: envoy-gateway-system}
          - {dir: metrics-server, path: core/metrics-server, namespace: metrics-server}
          - {dir: monitoring, path: core/rehearsal/monitoring, namespace: monitoring}
          - {dir: pg-drill, path: core/rehearsal/pg-drill, namespace: pg-drill}
          - {dir: redis, path: core/redis, namespace: redis}
          - {dir: reloader, path: core/rehearsal/reloader, namespace: reloader}
      - op: replace
        path: /spec/template/spec/source/targetRevision
        value: rehearsal
