# The rehearsal cut of core/monitoring (ADR 0011). A rehearsal must not reach
# the live outside world:
#
#   Alertmanager config   replaced by alertmanager.yaml: every alert to the
#                         receiver `null`. No Telegram message, no Watchdog
#                         ping (the live check would see a second sender).
#   receivers mount       removed from the Alertmanager; the Secret
#                         monitoring/alertmanager-receivers is `rehearsal:
#                         omit` in the Secret Catalog.
#   Probes                the public-hosts Probes deleted: no probe of the
#                         live hosts. The mail Probes (rehearsed project
#                         `mail`, ADR 0010, Amendment 2026-11-14) go to the
#                         mail load balancer's fixed private address
#                         10.0.4.3, through the load balancer and its PROXY
#                         header, with the *_rehearsal modules (a rehearsal
#                         certificate is self-signed). The stage
#                         rehearsal-cuts refuses any Probe target that is not
#                         a private address or a cluster name, so a Probe
#                         added later must get its own patch here.
#
# The Grafana route stays: it attaches to the rehearsal Gateway only, and the
# zone stage accepts grafana.tosak.net while it points at live.
#
# The stage rehearsal-cuts proves each link is gone; monitoring-clean then
# proves every target is up and no alert that would page on live fires.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../monitoring
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: alertmanager-kps-alertmanager
    namespace: monitoring
    behavior: replace
    files:
      - alertmanager.yaml
patches:
  - target:
      group: monitoring.coreos.com
      kind: Alertmanager
      name: kps-alertmanager
    patch: |-
      - op: remove
        path: /spec/secrets
  # The public-hosts Probes (core/monitoring/probes/public-hosts.yaml).
  - patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: Probe
      metadata:
        name: public-hosts-2xx
        namespace: monitoring
  - patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: Probe
      metadata:
        name: public-hosts-302
        namespace: monitoring
  - patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: Probe
      metadata:
        name: public-hosts-access
        namespace: monitoring
  # The mail Probes (core/monitoring/probes/mail.yaml).
  - target:
      group: monitoring.coreos.com
      kind: Probe
      name: mail-smtp
    patch: |-
      - op: test
        path: /spec/targets/staticConfig/static
        value: [mail.tosak.net:25]
      - op: replace
        path: /spec/targets/staticConfig/static
        value: [10.0.4.3:25]
      - op: test
        path: /spec/module
        value: smtp_starttls
      - op: replace
        path: /spec/module
        value: smtp_starttls_rehearsal
  - target:
      group: monitoring.coreos.com
      kind: Probe
      name: mail-submissions
    patch: |-
      - op: test
        path: /spec/targets/staticConfig/static
        value: [mail.tosak.net:465]
      - op: replace
        path: /spec/targets/staticConfig/static
        value: [10.0.4.3:465]
      - op: test
        path: /spec/module
        value: smtp_tls
      - op: replace
        path: /spec/module
        value: smtp_tls_rehearsal
  - target:
      group: monitoring.coreos.com
      kind: Probe
      name: mail-imaps
    patch: |-
      - op: test
        path: /spec/targets/staticConfig/static
        value: [mail.tosak.net:993]
      - op: replace
        path: /spec/targets/staticConfig/static
        value: [10.0.4.3:993]
      - op: test
        path: /spec/module
        value: imap_tls
      - op: replace
        path: /spec/module
        value: imap_tls_rehearsal
