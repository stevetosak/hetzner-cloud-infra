# What the CronJob mesh-catalog may do: read the one ConfigMap that holds the
# mesh store, kube-system/mesh-peers, and nothing else. kluster writes that
# store; this account never does.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-catalog
  namespace: nodes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mesh-catalog-read-store
  namespace: kube-system
rules:
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [mesh-peers]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mesh-catalog-read-store
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mesh-catalog-read-store
subjects:
  - kind: ServiceAccount
    name: mesh-catalog
    namespace: nodes
