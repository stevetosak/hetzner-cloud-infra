# The two StorageClasses of the hcloud CSI driver (ADR 0016). Hand-written, not
# rendered: csi-values.yaml switches the chart's own class off, because the
# chart cannot set an allowed topology. `kluster cp init` applies this file
# with csi.yaml (Stage csi); Argo CD does not sync core/hcloud.
#
# ALLOWED TOPOLOGY. A Hetzner volume attaches only to a Hetzner server in its
# own location, and only Nodes there run the CSI node pod, which reports the
# key csi.hetzner.cloud/location. With WaitForFirstConsumer and no allowed
# topology, a claim can be provisioned for a Node without the driver, and its
# pod never starts (kubernetes-csi/external-provisioner#544). The value is the
# name of the hcloud site in infra/nodes/<env>.yaml, which is the Hetzner
# location; a kluster test keeps them equal.
#
# 🔴 provisioner, parameters, reclaimPolicy and volumeBindingMode cannot be
# changed on an existing class; the API server refuses the apply. A change to
# one of them means deleting the class and applying it again, by hand and
# with the operator's yes; bound volumes keep working meanwhile. allowedTopologies
# and the annotations can be changed in place (Kubernetes v1.37.0, proven
# with a server-side dry run on live on 2026-11-22).
#
#   hcloud-volumes          the default class. Delete: a deleted claim deletes
#                           its volume.
#   hcloud-volumes-retain   every PostgreSQL instance volume (ADR 0003,
#                           Amendments 2026-10-01). Retain: a deleted claim,
#                           Cluster or namespace leaves the volume in place,
#                           detached. That is an Orphaned Volume: the daily
#                           workflow reports it and a person deletes it, never
#                           automation. A class's policy is copied into a PV
#                           only when the PV is created.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hcloud-volumes
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: csi.hetzner.cloud
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
allowedTopologies:
  - matchLabelExpressions:
      - key: csi.hetzner.cloud/location
        values:
          - hel1
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hcloud-volumes-retain
provisioner: csi.hetzner.cloud
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
allowedTopologies:
  - matchLabelExpressions:
      - key: csi.hetzner.cloud/location
        values:
          - hel1
