# Values for hcloud-csi. See README.md in this directory for the exact
# command that renders csi.yaml from them.
#
# Sized by ADR 0013 from the 2026-11-01..06 peaks (Capacity Plan Snapshots 0
# and 1, and Prometheus since 2026-11-05). The chart sets no requests, so each
# container was BestEffort, the first to be evicted. No CPU limit.
#
# Both get a system priority class (the chart sets none). With requests and
# priority 0, the node pod of a full worker stayed Pending on 2026-11-06: the
# old pod took no room, and the scheduler could not preempt for the new one.
# The node pod mounts every volume on its node, as flannel and kube-proxy
# carry the network, so it takes system-node-critical as they do; the
# controller takes system-cluster-critical, as the CCM does.
#
# HETZNER SERVERS ONLY (ADR 0016). The node pod gets no server ID from the
# metadata service on any other machine and crashes in a loop, so it runs
# only where the CCM labelled the Node provided-by=cloud. The chart's own
# StorageClass is off: both classes are in storageclasses.yaml, with the
# allowed topology the chart cannot set.

controller:
  priorityClassName: system-cluster-critical
  resources:
    csiAttacher:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 96Mi
    csiResizer:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 96Mi
    csiProvisioner:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 96Mi
    livenessProbe:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
    hcloudCSIDriver:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

node:
  priorityClassName: system-node-critical
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: instance.hetzner.cloud/provided-by
                operator: In
                values:
                  - cloud
  resources:
    csiNodeDriverRegistrar:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
    livenessProbe:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
    hcloudCSIDriver:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

storageClasses: []
