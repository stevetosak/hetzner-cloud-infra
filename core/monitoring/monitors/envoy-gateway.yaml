# Scrapes Envoy Gateway: the controller (Service envoy-gateway, port
# `metrics`, 19001) and the Envoy proxies of the Gateway tosak (container port
# `metrics`, 19001, /stats/prometheus). Both live in envoy-gateway-system.
# The pinned Envoy Gateway dashboards read both.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-gateway
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [envoy-gateway-system]
  selector:
    matchLabels:
      control-plane: envoy-gateway
  endpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [envoy-gateway-system]
  selector:
    matchLabels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: envoy-gateway
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
