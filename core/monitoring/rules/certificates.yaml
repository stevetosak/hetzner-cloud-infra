# Certificates issued by cert-manager (ADR 0011): the wildcard certificate of
# the Public Entry Point and the barman-cloud plugin's own pair.
#
# cert-manager renews a certificate at its renewal time (a third of its life
# before expiry: 30 days for a 90-day certificate). A renewal that fails shows
# first as an overdue renewal, long before the expiry.
#
# Metrics from the ServiceMonitor monitors/cert-manager.yaml. Unit tests:
# rules/tests/certificates.test.yaml, run by core/monitoring/check-rules.sh.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: certificates
  namespace: monitoring
spec:
  groups:
    - name: certificates
      rules:
        - alert: CertificateRenewalOverdue
          expr: |
            time() - certmanager_certificate_renewal_timestamp_seconds > 6 * 3600
          labels:
            severity: warning
          annotations:
            summary: The certificate {{ $labels.namespace }}/{{ $labels.name }} is not renewed.
            description: >-
              Its renewal time passed more than 6 hours ago. Read the
              Certificate's events and the CertificateRequest
              (kubectl describe certificate -n {{ $labels.namespace }} {{ $labels.name }}).
              For the wildcard: the DNS-01 token in cert-manager/cloudflare-dns-token.

        - alert: CertificateExpiresSoon
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 86400
          labels:
            severity: critical
          annotations:
            summary: The certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}.
            description: >-
              Renewal failed for more than 3 weeks. When the wildcard expires,
              every public host fails TLS at the origin.

        - alert: CertificateNotReady
          expr: |
            certmanager_certificate_ready_status{condition!="True"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: The certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready.
            description: >-
              The Certificate's Ready condition is {{ $labels.condition }}. Read
              its events (kubectl describe certificate -n {{ $labels.namespace }} {{ $labels.name }}).
