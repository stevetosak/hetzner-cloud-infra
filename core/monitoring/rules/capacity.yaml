# Memory of each container against its request and its limit (ADR 0013).
#
# Requests are set at the measured peak plus 30 %, so there is little slack,
# and the applications' memory use only grows. These alerts are the
# notification; raising the value is a manual change in git until the
# Autoscaling Plan (docs/plans/autoscaling-workloads-grow-without-a-manual-resize.md)
# makes it automatic.
#
# A container above its request is the first to be evicted when a node runs
# short; a container at its limit is OOM-killed. A container without a request
# or limit has no series to compare and never fires.
#
# The kubeadm static pods on the control plane (etcd, kube-apiserver,
# kube-controller-manager, kube-scheduler) are left out of the two memory
# rules: kubeadm sets their requests (etcd 100Mi, about 96 % used), the node is
# tainted so no workload competes with them, and a change needs the static
# manifest on k8s-cp. The Capacity Plan's Phase 2 sizes the control plane; the
# OOM-kill rule still covers them.
#
# The two recording rules give each container's memory request and limit,
# native sidecars included. A native sidecar is an init container with
# `restartPolicy: Always` (the barman-cloud sidecar in each PostgreSQL pod):
# kube-state-metrics reports it only in kube_pod_init_container_*, so a rule
# on kube_pod_container_resource_* alone never sees it, though it runs for
# the pod's whole life and its request is reserved on the node. An ordinary
# init container has finished before the pod's containers start, so it is
# not counted.
#
# WorkersMemoryCushionLow is the trigger to buy a worker (Capacity Plan,
# Phase 2): it fires when the memory the workers' pods request passes 80 % of
# the workers' allocatable memory, so at least a fifth stays free as a
# cushion. Its value is that share.
#
#   requested on the workers                 (Running and Pending pods, and
#                                             Pending pods not yet on a node)
#   / allocatable of the workers
#
# It replaced WorkersLoseNPlusOne on 2026-11-07, when the operator dropped
# N+1 as a requirement: a drain of k8swk2 showed that the requests fit on two
# workers by sum while the PostgreSQL replica fitted on neither. A sum, like
# this share, never proves that each pod fits on one node. Native sidecars
# count; ordinary init containers do not.
#
# ControlPlaneMemoryHigh is the signal to consider a larger control-plane
# server (Capacity Plan, Phase 2): the node's used memory (MemTotal −
# MemAvailable) above 90 % for 1.5 hours. Requests do not show it: the
# kubeadm static pods carry little or none (kube-apiserver, the largest at
# 1811 MiB on 2026-11-05..07, has none). The chart's NodeMemoryHighUtilization
# fires at the same 90 % after 15 minutes, on any node; this one says the
# level held. Neither alert buys anything: the operator decides.
#
# Unit tests: rules/tests/capacity.test.yaml, run by check-rules.sh.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: capacity
  namespace: monitoring
spec:
  groups:
    - name: capacity
      rules:
        - record: namespace_pod_container:memory_requests:bytes
          expr: |
            max by (namespace, pod, container, node) (kube_pod_container_resource_requests{resource="memory"})
              or on (namespace, pod, container)
            max by (namespace, pod, container, node) (
              kube_pod_init_container_resource_requests{resource="memory"}
                * on (namespace, pod, container) group_left ()
              max by (namespace, pod, container) (kube_pod_init_container_info{restart_policy="Always"})
            )

        - record: namespace_pod_container:memory_limits:bytes
          expr: |
            max by (namespace, pod, container, node) (kube_pod_container_resource_limits{resource="memory"})
              or on (namespace, pod, container)
            max by (namespace, pod, container, node) (
              kube_pod_init_container_resource_limits{resource="memory"}
                * on (namespace, pod, container) group_left ()
              max by (namespace, pod, container) (kube_pod_init_container_info{restart_policy="Always"})
            )

        - alert: ContainerMemoryNearRequest
          expr: |
            max by (namespace, pod, container) (
              container_memory_working_set_bytes{container!="", container!="POD"}
                unless container_memory_working_set_bytes{namespace="kube-system", container=~"etcd|kube-apiserver|kube-controller-manager|kube-scheduler"}
            )
              / on (namespace, pod, container)
            max by (namespace, pod, container) (namespace_pod_container:memory_requests:bytes)
              > 0.9
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.container }} uses {{ $value | humanizePercentage }} of its memory request."
            description: >-
              Pod {{ $labels.pod }}. Raise its memory request and limit by the
              sizing rule (ADR 0013: peak x 1.3, limit 2x) in git. Above its
              request it is the first to be evicted under memory pressure.

        - alert: ContainerMemoryNearLimit
          expr: |
            max by (namespace, pod, container) (
              container_memory_working_set_bytes{container!="", container!="POD"}
                unless container_memory_working_set_bytes{namespace="kube-system", container=~"etcd|kube-apiserver|kube-controller-manager|kube-scheduler"}
            )
              / on (namespace, pod, container)
            max by (namespace, pod, container) (namespace_pod_container:memory_limits:bytes)
              > 0.85
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.container }} uses {{ $value | humanizePercentage }} of its memory limit."
            description: >-
              Pod {{ $labels.pod }}. At its limit the kernel OOM-kills it.
              Raise its memory limit (and request) in git now.

        - alert: ContainerOOMKilled
          expr: |
            (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 15m >= 1)
              and on (namespace, pod, container)
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.container }} was OOM-killed."
            description: >-
              Pod {{ $labels.pod }} restarted after an OOM kill in the last 15
              minutes. Raise its memory limit in git; a JVM or Redis also needs
              its own cap checked (ADR 0013).

        - alert: WorkersMemoryCushionLow
          expr: |
            (
              sum(
                (
                  sum by (namespace, pod, node) (namespace_pod_container:memory_requests:bytes)
                    * on (namespace, pod) group_left ()
                  max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Running"})
                )
                  unless on (node) kube_node_role{role="control-plane"}
              )
              /
              sum(
                max by (node) (kube_node_status_allocatable{resource="memory"})
                  unless on (node) kube_node_role{role="control-plane"}
              )
            ) > 0.8
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "The workers' pods request {{ $value | humanizePercentage }} of the workers' memory."
            description: >-
              Less than a fifth of the workers' allocatable memory is left as
              a cushion. Lower a request that is above its measured peak
              (ADR 0013), or buy a worker by the Capacity Plan's order of
              purchase.

        - alert: ControlPlaneMemoryHigh
          expr: |
            (
              max by (node) (
                label_replace(
                  (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
                    * on (instance) group_left (nodename) node_uname_info,
                  "node", "$1", "nodename", "(.*)"
                )
              )
                and on (node) kube_node_role{role="control-plane"}
            ) > 0.9
          for: 90m
          labels:
            severity: warning
          annotations:
            summary: "The control plane {{ $labels.node }} has used {{ $value | humanizePercentage }} of its memory for 1.5 hours."
            description: >-
              The control plane's memory is close to full. Find what grew
              (kube-apiserver, etcd); if it is growth and not a leak, the
              operator decides on a larger server (Capacity Plan, Reference
              page "Capacity and growth"). Nothing is bought automatically.
