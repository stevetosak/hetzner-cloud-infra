# Unit tests of rules/capacity.yaml. Run by core/monitoring/check-rules.sh,
# which writes the rule file next to this one as capacity.rules.yaml.
rule_files: [capacity.rules.yaml]
evaluation_interval: 1m

tests:
  # Healthy: 100 MiB used of a 128 MiB request and a 256 MiB limit.
  - interval: 1m
    input_series:
      - {series: 'container_memory_working_set_bytes{namespace="doma",pod="doma-1",container="doma"}', values: '104857600x60'}
      - {series: 'container_memory_working_set_bytes{namespace="doma",pod="doma-1",container="POD"}', values: '999999999x60'}
      - {series: 'kube_pod_container_resource_requests{namespace="doma",pod="doma-1",container="doma",resource="memory"}', values: '134217728x60'}
      - {series: 'kube_pod_container_resource_limits{namespace="doma",pod="doma-1",container="doma",resource="memory"}', values: '268435456x60'}
      - {series: 'kube_pod_container_status_restarts_total{namespace="doma",pod="doma-1",container="doma"}', values: '0x60'}
    alert_rule_test:
      - {eval_time: 60m, alertname: ContainerMemoryNearRequest}
      - {eval_time: 60m, alertname: ContainerMemoryNearLimit}
      - {eval_time: 60m, alertname: ContainerOOMKilled}

  # 122 MiB of a 128 MiB request (95 %) and 48 % of the limit: the warning
  # fires after 30 minutes, the critical one does not.
  - interval: 1m
    input_series:
      - {series: 'container_memory_working_set_bytes{namespace="doma",pod="doma-1",container="doma"}', values: '127926272x60'}
      - {series: 'kube_pod_container_resource_requests{namespace="doma",pod="doma-1",container="doma",resource="memory"}', values: '134217728x60'}
      - {series: 'kube_pod_container_resource_limits{namespace="doma",pod="doma-1",container="doma",resource="memory"}', values: '268435456x60'}
    alert_rule_test:
      - {eval_time: 20m, alertname: ContainerMemoryNearRequest}
      - eval_time: 40m
        alertname: ContainerMemoryNearRequest
        exp_alerts:
          - exp_labels: {severity: warning, namespace: doma, pod: doma-1, container: doma}
            exp_annotations:
              summary: "doma/doma uses 95.31% of its memory request."
              description: >-
                Pod doma-1. Raise its memory request and limit by the
                sizing rule (ADR 0013: peak x 1.3, limit 2x) in git. Above its
                request it is the first to be evicted under memory pressure.
      - {eval_time: 40m, alertname: ContainerMemoryNearLimit}

  # 230 MiB of a 256 MiB limit (90 %): the critical alert fires after 10 minutes.
  - interval: 1m
    input_series:
      - {series: 'container_memory_working_set_bytes{namespace="doma",pod="doma-1",container="doma"}', values: '241172480x30'}
      - {series: 'kube_pod_container_resource_limits{namespace="doma",pod="doma-1",container="doma",resource="memory"}', values: '268435456x30'}
    alert_rule_test:
      - {eval_time: 5m, alertname: ContainerMemoryNearLimit}
      - eval_time: 15m
        alertname: ContainerMemoryNearLimit
        exp_alerts:
          - exp_labels: {severity: critical, namespace: doma, pod: doma-1, container: doma}
            exp_annotations:
              summary: "doma/doma uses 89.84% of its memory limit."
              description: >-
                Pod doma-1. At its limit the kernel OOM-kills it.
                Raise its memory limit (and request) in git now.

  # A restart at 20 m after an OOM kill fires at once and clears 15 minutes
  # later; a restart for another reason does not fire.
  - interval: 1m
    input_series:
      - {series: 'kube_pod_container_status_restarts_total{namespace="doma",pod="doma-1",container="doma"}', values: '0x20 1x40'}
      - {series: 'kube_pod_container_status_last_terminated_reason{namespace="doma",pod="doma-1",container="doma",reason="OOMKilled"}', values: '0x20 1x40'}
      - {series: 'kube_pod_container_status_restarts_total{namespace="authos",pod="duster-1",container="duster"}', values: '0x20 1x40'}
      - {series: 'kube_pod_container_status_last_terminated_reason{namespace="authos",pod="duster-1",container="duster",reason="Error"}', values: '0x20 1x40'}
    alert_rule_test:
      - {eval_time: 10m, alertname: ContainerOOMKilled}
      - eval_time: 25m
        alertname: ContainerOOMKilled
        exp_alerts:
          - exp_labels: {severity: critical, namespace: doma, pod: doma-1, container: doma}
            exp_annotations:
              summary: "doma/doma was OOM-killed."
              description: >-
                Pod doma-1 restarted after an OOM kill in the last 15
                minutes. Raise its memory limit in git; a JVM or Redis also needs
                its own cap checked (ADR 0013).
      - {eval_time: 40m, alertname: ContainerOOMKilled}

  # The control-plane etcd at 96 % of kubeadm's 100 MiB request and no limit:
  # left out until Phase 2 sizes the control plane. coredns in the same
  # namespace at 95 % still fires.
  - interval: 1m
    input_series:
      - {series: 'container_memory_working_set_bytes{namespace="kube-system",pod="etcd-k8s-cp",container="etcd"}', values: '100663296x60'}
      - {series: 'kube_pod_container_resource_requests{namespace="kube-system",pod="etcd-k8s-cp",container="etcd",resource="memory"}', values: '104857600x60'}
      - {series: 'container_memory_working_set_bytes{namespace="kube-system",pod="coredns-1",container="coredns"}', values: '69206016x60'}
      - {series: 'kube_pod_container_resource_requests{namespace="kube-system",pod="coredns-1",container="coredns",resource="memory"}', values: '73400320x60'}
    alert_rule_test:
      - eval_time: 40m
        alertname: ContainerMemoryNearRequest
        exp_alerts:
          - exp_labels: {severity: warning, namespace: kube-system, pod: coredns-1, container: coredns}
            exp_annotations:
              summary: "kube-system/coredns uses 94.29% of its memory request."
              description: >-
                Pod coredns-1. Raise its memory request and limit by the
                sizing rule (ADR 0013: peak x 1.3, limit 2x) in git. Above its
                request it is the first to be evicted under memory pressure.

  # The cushion on three workers of 1000 MiB. Each runs 600 MiB of pods and a
  # 50 MiB DaemonSet pod: 1950 of 3000 MiB, 65 %. A finished Job pod and the
  # control plane's pods do not count. At 20 m a 600 MiB pod waits
  # unscheduled: 2550 MiB, 85 %, and the warning fires an hour later.
  - interval: 1m
    input_series:
      - {series: 'kube_node_status_allocatable{node="k8s-cp",resource="memory"}', values: '1048576000x120'}
      - {series: 'kube_node_role{node="k8s-cp",role="control-plane"}', values: '1x120'}
      - {series: 'kube_pod_container_resource_requests{namespace="kube-system",pod="etcd-k8s-cp",container="etcd",node="k8s-cp",resource="memory"}', values: '1048576000x120'}
      - {series: 'kube_pod_status_phase{namespace="kube-system",pod="etcd-k8s-cp",phase="Running"}', values: '1x120'}
      - {series: 'kube_node_status_allocatable{node="wk1",resource="memory"}', values: '1048576000x120'}
      - {series: 'kube_node_status_allocatable{node="wk2",resource="memory"}', values: '1048576000x120'}
      - {series: 'kube_node_status_allocatable{node="wk3",resource="memory"}', values: '1048576000x120'}
      - {series: 'kube_pod_container_resource_requests{namespace="doma",pod="app-1",container="app",node="wk1",resource="memory"}', values: '629145600x120'}
      - {series: 'kube_pod_container_resource_requests{namespace="doma",pod="app-2",container="app",node="wk2",resource="memory"}', values: '629145600x120'}
      - {series: 'kube_pod_container_resource_requests{namespace="doma",pod="app-3",container="app",node="wk3",resource="memory"}', values: '629145600x120'}
      - {series: 'kube_pod_status_phase{namespace="doma",pod="app-1",phase="Running"}', values: '1x120'}
      - {series: 'kube_pod_status_phase{namespace="doma",pod="app-2",phase="Running"}', values: '1x120'}
      - {series: 'kube_pod_status_phase{namespace="doma",pod="app-3",phase="Running"}', values: '1x120'}
      - {series: 'kube_pod_container_resource_requests{namespace="kube-flannel",pod="ds-1",container="kube-flannel",node="wk1",resource="memory"}', values: '52428800x120'}
      - {series: 'kube_pod_container_resource_requests{namespace="kube-flannel",pod="ds-2",container="kube-flannel",node="wk2",resource="memory"}', values: '52428800x120'}
      - {series: 'kube_pod_container_resource_requests{namespace="kube-flannel",pod="ds-3",container="kube-flannel",node="wk3",resource="memory"}', values: '52428800x120'}
      - {series: 'kube_pod_status_phase{namespace="kube-flannel",pod="ds-1",phase="Running"}', values: '1x120'}
      - {series: 'kube_pod_status_phase{namespace="kube-flannel",pod="ds-2",phase="Running"}', values: '1x120'}
      - {series: 'kube_pod_status_phase{namespace="kube-flannel",pod="ds-3",phase="Running"}', values: '1x120'}
      - {series: 'kube_pod_container_resource_requests{namespace="pg-drill",pod="job-1",container="drill",node="wk1",resource="memory"}', values: '1048576000x120'}
      - {series: 'kube_pod_status_phase{namespace="pg-drill",pod="job-1",phase="Running"}', values: '0x120'}
      - {series: 'kube_pod_status_phase{namespace="pg-drill",pod="job-1",phase="Succeeded"}', values: '1x120'}
      - {series: 'kube_pod_container_resource_requests{namespace="doma",pod="app-4",container="app",node="",resource="memory"}', values: '_x20 629145600x100'}
      - {series: 'kube_pod_status_phase{namespace="doma",pod="app-4",phase="Pending"}', values: '_x20 1x100'}
    alert_rule_test:
      - {eval_time: 15m, alertname: WorkersMemoryCushionLow}
      - {eval_time: 70m, alertname: WorkersMemoryCushionLow}
      - eval_time: 85m
        alertname: WorkersMemoryCushionLow
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "The workers' pods request 85% of the workers' memory."
              description: >-
                Less than a fifth of the workers' allocatable memory is left as
                a cushion. Lower a request that is above its measured peak
                (ADR 0013), or buy a worker by the Capacity Plan's order of
                purchase.

  # A native sidecar (an init container with restartPolicy Always) at 152 MiB
  # of a 160 MiB request fires like a container. An ordinary init container
  # at 95 % of its request is ignored: it has finished.
  - interval: 1m
    input_series:
      - {series: 'container_memory_working_set_bytes{namespace="pg-cluster",pod="pg-1",container="plugin-barman-cloud"}', values: '159383552x60'}
      - {series: 'kube_pod_init_container_resource_requests{namespace="pg-cluster",pod="pg-1",container="plugin-barman-cloud",node="wk1",resource="memory"}', values: '167772160x60'}
      - {series: 'kube_pod_init_container_info{namespace="pg-cluster",pod="pg-1",container="plugin-barman-cloud",restart_policy="Always"}', values: '1x60'}
      - {series: 'container_memory_working_set_bytes{namespace="pg-cluster",pod="pg-1",container="bootstrap-controller"}', values: '381681664x60'}
      - {series: 'kube_pod_init_container_resource_requests{namespace="pg-cluster",pod="pg-1",container="bootstrap-controller",node="wk1",resource="memory"}', values: '402653184x60'}
      - {series: 'kube_pod_init_container_info{namespace="pg-cluster",pod="pg-1",container="bootstrap-controller"}', values: '1x60'}
    alert_rule_test:
      - eval_time: 40m
        alertname: ContainerMemoryNearRequest
        exp_alerts:
          - exp_labels: {severity: warning, namespace: pg-cluster, pod: pg-1, container: plugin-barman-cloud}
            exp_annotations:
              summary: "pg-cluster/plugin-barman-cloud uses 95% of its memory request."
              description: >-
                Pod pg-1. Raise its memory request and limit by the
                sizing rule (ADR 0013: peak x 1.3, limit 2x) in git. Above its
                request it is the first to be evicted under memory pressure.

  # The cushion with a native sidecar: three workers of 1000 MiB, 600 MiB of
  # pods and a 50 MiB DaemonSet pod on each, 1950 of 3000 MiB. A 600 MiB
  # native sidecar in app-1 makes it 2550, 85 %. A 500 MiB ordinary init
  # container in app-2 does not count (it would make it 102 %).
  - interval: 1m
    input_series:
      - {series: 'kube_node_status_allocatable{node="wk1",resource="memory"}', values: '1048576000x90'}
      - {series: 'kube_node_status_allocatable{node="wk2",resource="memory"}', values: '1048576000x90'}
      - {series: 'kube_node_status_allocatable{node="wk3",resource="memory"}', values: '1048576000x90'}
      - {series: 'kube_pod_container_resource_requests{namespace="doma",pod="app-1",container="app",node="wk1",resource="memory"}', values: '629145600x90'}
      - {series: 'kube_pod_container_resource_requests{namespace="doma",pod="app-2",container="app",node="wk2",resource="memory"}', values: '629145600x90'}
      - {series: 'kube_pod_container_resource_requests{namespace="doma",pod="app-3",container="app",node="wk3",resource="memory"}', values: '629145600x90'}
      - {series: 'kube_pod_init_container_resource_requests{namespace="doma",pod="app-1",container="sidecar",node="wk1",resource="memory"}', values: '629145600x90'}
      - {series: 'kube_pod_init_container_info{namespace="doma",pod="app-1",container="sidecar",restart_policy="Always"}', values: '1x90'}
      - {series: 'kube_pod_init_container_resource_requests{namespace="doma",pod="app-2",container="init",node="wk2",resource="memory"}', values: '524288000x90'}
      - {series: 'kube_pod_init_container_info{namespace="doma",pod="app-2",container="init"}', values: '1x90'}
      - {series: 'kube_pod_status_phase{namespace="doma",pod="app-1",phase="Running"}', values: '1x90'}
      - {series: 'kube_pod_status_phase{namespace="doma",pod="app-2",phase="Running"}', values: '1x90'}
      - {series: 'kube_pod_status_phase{namespace="doma",pod="app-3",phase="Running"}', values: '1x90'}
      - {series: 'kube_pod_container_resource_requests{namespace="kube-flannel",pod="ds-1",container="kube-flannel",node="wk1",resource="memory"}', values: '52428800x90'}
      - {series: 'kube_pod_container_resource_requests{namespace="kube-flannel",pod="ds-2",container="kube-flannel",node="wk2",resource="memory"}', values: '52428800x90'}
      - {series: 'kube_pod_container_resource_requests{namespace="kube-flannel",pod="ds-3",container="kube-flannel",node="wk3",resource="memory"}', values: '52428800x90'}
      - {series: 'kube_pod_status_phase{namespace="kube-flannel",pod="ds-1",phase="Running"}', values: '1x90'}
      - {series: 'kube_pod_status_phase{namespace="kube-flannel",pod="ds-2",phase="Running"}', values: '1x90'}
      - {series: 'kube_pod_status_phase{namespace="kube-flannel",pod="ds-3",phase="Running"}', values: '1x90'}
    alert_rule_test:
      - eval_time: 70m
        alertname: WorkersMemoryCushionLow
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "The workers' pods request 85% of the workers' memory."
              description: >-
                Less than a fifth of the workers' allocatable memory is left as
                a cushion. Lower a request that is above its measured peak
                (ADR 0013), or buy a worker by the Capacity Plan's order of
                purchase.
