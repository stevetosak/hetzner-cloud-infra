# The VerticalPodAutoscaler objects of the workloads in monitoring. Prometheus and Alertmanager are
# targeted through their custom resources, the top-level owners of their StatefulSets (ADR 0014).
# updateMode InPlaceOrRecreate: the updater resizes the running pod in place, and
# evicts it only when the node cannot fit the new request.
# RequestsOnly: VPA sets requests, never limits. minAllowed is the ADR 0013
# floor (10m, 32Mi), higher where ADR 0014 names one (PostgreSQL, Envoy).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kps-prometheus
  namespace: monitoring
spec:
  targetRef:
    apiVersion: monitoring.coreos.com/v1
    kind: Prometheus
    name: kps-prometheus
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 32Mi}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kps-alertmanager
  namespace: monitoring
spec:
  targetRef:
    apiVersion: monitoring.coreos.com/v1
    kind: Alertmanager
    name: kps-alertmanager
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 32Mi}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: blackbox-exporter
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 32Mi}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kps-grafana
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kps-grafana
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      # Capped (Capacity Plan "reclaim requests", 2026-11-16): the recommendation
      # followed Grafana's start spike to 933 Mi while it uses about 420 MiB.
      # Grafana has no memory limit, so a start above the request is not killed
      # while the node has room.
      - containerName: grafana
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {memory: 512Mi}
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 32Mi}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kps-kube-state-metrics
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kps-kube-state-metrics
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 32Mi}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kps-operator
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kps-operator
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 32Mi}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kps-prometheus-node-exporter
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: kps-prometheus-node-exporter
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 32Mi}
