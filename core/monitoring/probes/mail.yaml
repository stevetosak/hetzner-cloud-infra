# The mail ports of mail.tosak.net (Email Plan, Phase 2): SMTP with STARTTLS
# on 25, implicit TLS on 465 and 993. One Probe per module, as in
# public-hosts.yaml; the modules are in blackbox-exporter-values.yaml.
#
# The probe goes to the private address of the mail load balancer, 10.0.4.3
# (pinned by load-balancer.hetzner.cloud/private-ipv4 on the Service), not to
# its public one: Hetzner Cloud blocks outbound 25 and 465 from every server,
# so a probe to the public address times out on those ports while real mail
# arrives. The load balancer still adds the PROXY header, so the probe tests
# the load balancer, the PROXY trust, the pod, the protocol and the
# certificate Stalwart serves (server_name mail.tosak.net in the module); DNS
# and the public address are left to the DNS check script. The relabeling
# keeps the instance label mail.tosak.net:<port>, which the alerts show.
# Alerts: rules/mail.yaml.
#
# These targets are not public hosts: the job is mail-ports, and kluster
# services check pairs only the job public-hosts with HTTPRoutes.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: mail-smtp
  namespace: monitoring
spec:
  jobName: mail-ports
  module: smtp_starttls
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  interval: 1m
  scrapeTimeout: 15s
  targets:
    staticConfig:
      static:
        - 10.0.4.3:25
      relabelingConfigs:
        - targetLabel: instance
          replacement: mail.tosak.net:25
---
apiVersion: monitoring.coreos.com/v1
