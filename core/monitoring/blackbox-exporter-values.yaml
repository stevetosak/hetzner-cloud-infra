# Values for prometheus-blackbox-exporter, rendered by render.sh into
# blackbox-exporter.yaml. Not a manifest: never list it in kustomization.yaml.
#
# The exporter runs the probes of the public hosts (ADR 0011). Prometheus
# scrapes /probe?target=<url>&module=<module> for each target of
# probes/public-hosts.yaml; the request goes out through Cloudflare and back,
# so one probe tests DNS, Cloudflare, the origin lock, the load balancer, the
# Gateway, the route and the pod.
fullnameOverride: blackbox-exporter

image:
  tag: v0.29.1-distroless
  digest: sha256:4d6d2d50ecabf3a0b10e8f6f5c4b14fc0c2326dcc2f7fe161668de722d5bf61e

revisionHistoryLimit: 3

resources:
  requests:
    cpu: 10m
    memory: 24Mi
  limits:
    memory: 64Mi

# One module per expected status. No module follows a redirect: a host that
# starts to redirect (to a login, to another host) has changed, and its probe
# must say so. A Probe names its module; probes/public-hosts.yaml holds one
# Probe per module.
config:
  modules:
    http_2xx:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: false
        preferred_ip_protocol: ip4
    http_302:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [302]
        follow_redirects: false
        preferred_ip_protocol: ip4
    # A host behind Cloudflare Access: the edge answers 302 to the Access
    # login before the request reaches the origin. The status alone does not
    # prove the gate, because Grafana also answers 302 (to /login) when
    # Access is gone; the Location must be the Access login. The pattern
    # names no team domain: the repository is public.
    http_access:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [302]
        follow_redirects: false
        preferred_ip_protocol: ip4
        fail_if_header_not_matches:
          - header: Location
            regexp: '^https://[a-z0-9-]+\.cloudflareaccess\.com/cdn-cgi/access/login/'
