# Values for prometheus-blackbox-exporter, rendered by render.sh into
# blackbox-exporter.yaml. Not a manifest: never list it in kustomization.yaml.
#
# The exporter runs the probes of the public hosts (ADR 0011). Prometheus
# scrapes /probe?target=<url>&module=<module> for each target of
# probes/public-hosts.yaml; the request goes out through Cloudflare and back,
# so one probe tests DNS, Cloudflare, the origin lock, the load balancer, the
# Gateway, the route and the pod.
fullnameOverride: blackbox-exporter

image:
  tag: v0.29.1-distroless
  digest: sha256:4d6d2d50ecabf3a0b10e8f6f5c4b14fc0c2326dcc2f7fe161668de722d5bf61e

revisionHistoryLimit: 3

# Sized by ADR 0013 from the 2026-11-01..05 peaks (Capacity Plan Snapshots 0 and 1): 21 MiB.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

# One module per expected status. No module follows a redirect: a host that
# starts to redirect (to a login, to another host) has changed, and its probe
# must say so. A Probe names its module; probes/public-hosts.yaml holds one
# Probe per module.
config:
  modules:
    http_2xx:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: false
        preferred_ip_protocol: ip4
    http_302:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [302]
        follow_redirects: false
        preferred_ip_protocol: ip4
    # A host behind Cloudflare Access: the edge answers 302 to the Access
    # login before the request reaches the origin. The status alone does not
    # prove the gate, because Grafana also answers 302 (to /login) when
    # Access is gone; the Location must be the Access login. The pattern
    # names no team domain: the repository is public.
    http_access:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [302]
        follow_redirects: false
        preferred_ip_protocol: ip4
        fail_if_header_not_matches:
          - header: Location
            regexp: '^https://[a-z0-9-]+\.cloudflareaccess\.com/cdn-cgi/access/login/'
    # The mail ports of mail.tosak.net (probes/mail.yaml). Each module speaks
    # the protocol to its end with valid commands only: Stalwart bans an
    # address for invalid commands (scan) and for sessions left open too long
    # (loiter), and a probe every minute would reach either rate. `send`
    # appends "\n", so each line ends in "\r" to make the CRLF.
    # 25: STARTTLS must be offered and work, then EHLO again over TLS. Each
    # EHLO name Stalwart has not seen in the session runs an SPF check, which
    # fails for the probe and is logged at info, once a minute; nothing else.
    smtp_starttls:
      prober: tcp
      timeout: 10s
      tcp:
        preferred_ip_protocol: ip4
        tls_config:
          server_name: mail.tosak.net
        query_response: &smtp_starttls_dialogue
          - expect: "^220 "
          - send: "EHLO probe.tosak.net\r"
          - expect: "^250[ -]STARTTLS"
          - send: "STARTTLS\r"
          - expect: "^220 "
          - starttls: true
          - send: "EHLO probe.tosak.net\r"
          - expect: "^250 "
          - send: "QUIT\r"
          - expect: "^221 "
    # 465: implicit TLS. No EHLO, so no SPF check.
    smtp_tls:
      prober: tcp
      timeout: 10s
      tcp:
        preferred_ip_protocol: ip4
        tls: true
        tls_config:
          server_name: mail.tosak.net
        query_response: &smtp_tls_dialogue
          - expect: "^220 "
          - send: "QUIT\r"
          - expect: "^221 "
    # 993: implicit TLS, the IMAP greeting, then LOGOUT.
    imap_tls:
      prober: tcp
      timeout: 10s
      tcp:
        preferred_ip_protocol: ip4
        tls: true
        tls_config:
          server_name: mail.tosak.net
        query_response: &imap_tls_dialogue
          - expect: "^\\* OK"
          - send: "a1 LOGOUT\r"
          - expect: "^a1 OK"
    # The rehearsal's copies of the three mail modules: the cut
    # core/rehearsal/monitoring points the mail Probes at them. A rehearsal
    # certificate is self-signed (core/rehearsal/cert-manager), so these skip
    # the chain check; the dialogue (the same anchors) and the expiry metric
    # stay. No live Probe uses them.
    smtp_starttls_rehearsal:
      prober: tcp
      timeout: 10s
      tcp:
        preferred_ip_protocol: ip4
        tls_config:
          server_name: mail.tosak.net
          insecure_skip_verify: true
        query_response: *smtp_starttls_dialogue
    smtp_tls_rehearsal:
      prober: tcp
      timeout: 10s
      tcp:
        preferred_ip_protocol: ip4
        tls: true
        tls_config:
          server_name: mail.tosak.net
          insecure_skip_verify: true
        query_response: *smtp_tls_dialogue
    imap_tls_rehearsal:
      prober: tcp
      timeout: 10s
      tcp:
        preferred_ip_protocol: ip4
        tls: true
        tls_config:
          server_name: mail.tosak.net
          insecure_skip_verify: true
        query_response: *imap_tls_dialogue
