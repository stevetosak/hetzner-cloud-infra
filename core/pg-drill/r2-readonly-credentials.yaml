# Template only — documents the shape. The real Secret is committed encrypted
# as r2-readonly-credentials.enc.yaml and applied with scripts/secrets.sh
# (ADR 0003, Amendments 2026-10-01).
#
# The R2 Account token with Object Read on `tosak-pg-backups` and
# `tosak-drill-results` — the SAME token the outside watcher holds as
# R2_READONLY_* (runbook step 16). Two readers use it here: the barman-cloud
# sidecar that restores the drill instance (objectstore.yaml), and drill.sh,
# which lists the WAL to find the LSN the restore must reach. It cannot write,
# so a fault in the drill cannot touch the backups.
#
# Access Key ID 32 characters, Secret Access Key 64.
apiVersion: v1
kind: Secret
metadata:
  name: r2-readonly-credentials
  namespace: pg-drill
type: Opaque
stringData:
  ACCESS_KEY_ID: ""
  ACCESS_SECRET_KEY: ""
