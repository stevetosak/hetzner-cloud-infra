# Template only — documents the shape. The real Secret is committed encrypted
# as r2-drill-results-credentials.enc.yaml and applied with scripts/secrets.sh.
#
# An R2 Account token with Object Read & Write on `tosak-drill-results` ONLY.
# drill.sh writes one result object per run with it, which the outside watcher
# reads (runbook step 16). It must not reach `tosak-pg-backups`.
#
# Access Key ID 32 characters, Secret Access Key 64.
apiVersion: v1
kind: Secret
metadata:
  name: r2-drill-results-credentials
  namespace: pg-drill
type: Opaque
stringData:
  ACCESS_KEY_ID: ""
  ACCESS_SECRET_KEY: ""
