# kubectl apply -k core/pg-drill — after namespace.yaml and the Secrets
# (README.md). The *.enc.yaml Secrets and their blank templates are NOT
# listed: the Secrets go through scripts/secrets.sh, and a template must
# never be applied.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - objectstore.yaml
  - cronjob.yaml
# drill.sh and the drill Cluster stay real files, linted and diffed as such.
# The name gets a content hash, so a changed script rolls into the CronJob.
configMapGenerator:
  - name: restore-drill
    namespace: pg-drill
    files:
      - drill/drill.sh
      - drill/cluster.yaml
