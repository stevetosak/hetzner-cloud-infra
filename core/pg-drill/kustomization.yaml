# kubectl apply -k core/pg-drill — after namespace.yaml and the Secrets
# (README.md). NOT listed: the namespace, which is applied by hand like every
# namespace in this repository (so `kubectl delete -k` cannot remove it), the
# *.enc.yaml Secrets, which go through scripts/secrets.sh, and their blank
# templates, which must never be applied.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - objectstore.yaml
  - cronjob.yaml
# drill.sh and the drill Cluster stay real files, linted and diffed as such.
# The name gets a content hash, so a changed script rolls into the CronJob.
configMapGenerator:
  - name: restore-drill
    namespace: pg-drill
    files:
      - drill/drill.sh
      - drill/cluster.yaml
