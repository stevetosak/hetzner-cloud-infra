# The live Node set: every site the cluster's Nodes stand on, and the
# capability profile of each (ADR 0016, Amendments).
#
# kluster writes a site's profile on each of its Nodes as admin labels under
# tosak.net.node-restriction.kubernetes.io/ (provider, site, reliability,
# reach, block-volumes, load-balancer). A kubelet cannot set or change them,
# so a placement rule can trust them. `kluster node profile` writes and
# checks them; `node add` and `cp init` do it after each join.
#
#   provider      what provisions the site's machines. Exactly one site has
#                 hcloud: the Control Plane and the Worker set belong to it,
#                 and its name must be their Hetzner location.
#   reliability   high | best-effort. A best-effort Node can go away at any
#                 time; it registers with the taint
#                 tosak.net/reliability=best-effort:NoSchedule.
#   reach         public (a public address) | nat (only outbound).
#   blockVolumes  the kind of block volume the site attaches; empty: none.
#   loadBalancer  the kind of load balancer that reaches the site; empty:
#                 none.
#   meshSubnet    the site's /24 inside 10.101.0.0/16 on wg-mesh; a site
#                 without one holds no machine of the mesh.
#
# Two sections follow once the mesh is in use: `machines`, each machine of the
# mesh with its site, its provisioner (hcloud or byo, never taken from the
# site's provider) and its wg-mesh address, and `mesh`, whose relay carries
# the traffic between two NAT sites. `kluster node add <name> --provisioner
# byo --site <site>` writes a byo machine's entry. The schema and its rules:
# docs/runbook/workers.md#join-the-mesh.
sites:
  hel1:
    provider: hcloud
    reliability: high
    reach: public
    blockVolumes: hcloud
    loadBalancer: hcloud
  # The first self-hosted site.
  ts1:
    provider: self-hosted
    reliability: best-effort
    reach: nat
