# doma.tosak.net (ADR 0008). Replaces projects/doma/ingress.yaml.
#
# 🔴 THE SSE SETTINGS ARE NOT INERT, and ADR 0008 missed them. The deleted
# Ingress carried two annotations that the ADR's audit of `rewrite-target`
# never looked at:
#
#     nginx.ingress.kubernetes.io/proxy-buffering: 'off'
#     nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
#
# They exist for M7 (server-sent events). Each needs a different answer here:
#
#   * `proxy-buffering: off` needs NO equivalent. Envoy streams responses; it
#     does not buffer them the way nginx does by default.
#
#   * `proxy-read-timeout` DOES need one, and a literal translation would be
#     wrong. Envoy's default route timeout is 15 seconds, so without this an
#     SSE stream is cut after 15 seconds. But nginx's `proxy_read_timeout` is
#     an INACTIVITY timeout between reads, while Gateway API's
#     `timeouts.request` is the TOTAL duration of the request. Copying 3600
#     across would cap a healthy stream at one hour, which the nginx setting
#     never did. `0s` disables the timeout, which preserves the intent.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: doma
  namespace: doma
  labels:
    app: doma
spec:
  parentRefs:
    - name: tosak
      namespace: gateway
      sectionName: https
  hostnames:
    - doma.tosak.net
  rules:
    - backendRefs:
        - name: doma
          port: 80
      timeouts:
        request: 0s
