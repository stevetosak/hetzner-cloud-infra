apiVersion: apps/v1
kind: Deployment
metadata:
  name: doma
  labels:
    app: doma
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: doma
  template:
    metadata:
      labels:
        app: doma
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: doma
          image: stevetosak/doma
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: doma-config
            - secretRef:
                name: credentials
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    type: Recreate
