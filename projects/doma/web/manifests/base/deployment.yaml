apiVersion: apps/v1
kind: Deployment
metadata:
  name: doma
  labels:
    app: doma
  annotations:
    # Reloader restarts this Deployment when a Secret it reads changes (core/reloader).
    secret.reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: doma
  template:
    metadata:
      labels:
        app: doma
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: doma
          image: stevetosak/doma
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: doma-config
            - secretRef:
                name: credentials
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          # Sized by ADR 0013 from the 2026-11-01..05 peaks (Capacity Plan Snapshots 0 and 1).
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              memory: 192Mi
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    type: Recreate
