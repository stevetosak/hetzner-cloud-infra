# Committed as a template with blank values only — it documents what secrets exist.
# Real values are applied via projects/doma/scripts/init_secrets.sh, never committed.
apiVersion: v1
kind: Secret
metadata:
  name: credentials
  namespace: doma
type: Opaque
stringData:
  DATABASE_URL: ''
  SESSION_SECRET: ''
  GOOGLE_CLIENT_SECRET: ''
  # Fill in both, or leave both blank. The token alone decides whether the
  # bot runs at all; with it blank, `/api/telegram/webhook` answers 404.
  #
  # 🔴 The webhook secret is NOT optional once the token is set. It is the
  # only authentication on a public POST endpoint, and an empty value makes
  # the app skip the check AND clear the secret held by Telegram on each
  # boot. See projects/doma/scripts/init_secrets.sh for the detail.
  TELEGRAM_BOT_TOKEN: ''
  TELEGRAM_WEBHOOK_SECRET: ''
