# imaps.tosak.net and imaps-api.tosak.net (ADR 0008).
#
# 🔴 CONVERTED AND COMMITTED, BUT NOT APPLIED. imaps is in Projects/Inactive
# and out of scope under ADR 0003, exactly like the rest of its manifests.
#
# Two things keep this honest if it is ever applied by accident. The
# `imaps` namespace does not exist, and the shared Gateway's
# `allowedRoutes` does not name it — so the route would be refused with
# `NotAllowedByListeners` rather than quietly claiming a host.
#
# No URLRewrite filter: the old `rewrite-target: /` annotation was inert,
# because every path in the deleted Ingress was `/`.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: imaps
  namespace: imaps
spec:
  parentRefs:
    - name: tosak
      namespace: gateway
      sectionName: https
  hostnames:
    - imaps.tosak.net
  rules:
    - backendRefs:
        - name: imaps-frontend
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: imaps-api
  namespace: imaps
spec:
  parentRefs:
    - name: tosak
      namespace: gateway
      sectionName: https
  hostnames:
    - imaps-api.tosak.net
  rules:
    - backendRefs:
        - name: imaps-backend
          port: 80
