apiVersion: apps/v1
kind: Deployment
metadata:
  name: wasteio-mosquitto
  labels:
    app: wasteio-mosquitto
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: wasteio-mosquitto
  template:
    metadata:
      labels:
        app: wasteio-mosquitto
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1883
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
            - name: data
              mountPath: /mosquitto/data
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: wasteio-mosquitto-config
        - name: data
          persistentVolumeClaim:
            claimName: wasteio-mosquitto-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wasteio-mosquitto-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
