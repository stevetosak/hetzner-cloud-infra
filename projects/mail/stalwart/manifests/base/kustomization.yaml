apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
# The bootstrap config, the settings plan and the script that applies it stay
# real files. The names get a content hash, so a changed plan restarts the pod
# and the init container applies it.
configMapGenerator:
  - name: stalwart
    files:
      - config/config.json
      - config/settings.ndjson
      - config/apply-settings.sh
  # A rehearsal cut replaces the bucket with tosak-mail-blobs-rehearsal.
  - name: stalwart-env
    literals:
      - S3_BUCKET=tosak-mail-blobs
