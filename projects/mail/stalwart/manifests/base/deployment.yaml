apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart
  labels:
    app: stalwart
  annotations:
    # Reloader restarts this Deployment when a Secret it reads changes (core/reloader).
    secret.reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 3
  # Each Stalwart process leases a node ID in the data store and keeps its
  # in-memory store to itself: two pods must never run at the same time.
  # Recreate stops the old pod before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stalwart
  template:
    metadata:
      labels:
        app: stalwart
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Applies the settings plan from git (config/settings.ndjson) with
        # Stalwart in recovery mode, before every normal start. On an empty
        # data store a normal start inserts Stalwart's own defaults (seven
        # listeners, a direct MX route, a log file on the read-only disk), so
        # the plan must be in place first. A change made in the web UI is
        # undone at the next restart: git is the source of the settings.
        - name: apply-settings
          image: stalwartlabs/stalwart:v1.0.3@sha256:73c684a84c24f5b4206ec266a8deb8986fe44a9f623997e07f084388d943c8bd
          imagePullPolicy: IfNotPresent
          # The image entrypoint is the server binary itself, so replacing it
          # drops no privilege step.
          command: ["sh", "/etc/stalwart/apply-settings.sh"]
          env:
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: stalwart-env
                  key: S3_BUCKET
            - name: STALWART_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin
                  key: password
            - name: STALWART_RECOVERY_ADMIN
              value: admin:$(STALWART_ADMIN_PASSWORD)
            - name: STALWART_USER
              value: admin
            - name: STALWART_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # The binary carries cap_net_bind_service as a file capability,
            # which binds 25, 465 and 993 without root.
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: db-credentials
              mountPath: /run/secrets/db
              readOnly: true
            - name: ses-smtp
              mountPath: /run/secrets/ses-smtp
              readOnly: true
            - name: blob-store
              mountPath: /run/secrets/blob-store
              readOnly: true
            - name: metrics
              mountPath: /run/secrets/metrics
              readOnly: true
            - name: tls
              mountPath: /run/secrets/tls
              readOnly: true
            - name: stalwart-cli
              mountPath: /opt/stalwart-cli
              readOnly: true
          resources:
            # A first estimate; the rehearsal measures it (ADR 0013).
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v1.0.3@sha256:73c684a84c24f5b4206ec266a8deb8986fe44a9f623997e07f084388d943c8bd
          imagePullPolicy: IfNotPresent
          env:
            - name: STALWART_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin
                  key: password
            # The recovery admin also signs in in normal mode: it is the
            # permanent admin login.
            - name: STALWART_RECOVERY_ADMIN
              value: admin:$(STALWART_ADMIN_PASSWORD)
          ports:
            - name: smtp
              containerPort: 25
            - name: submissions
              containerPort: 465
            - name: imaps
              containerPort: 993
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # The binary carries cap_net_bind_service as a file capability,
            # which binds 25, 465 and 993 without root.
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: db-credentials
              mountPath: /run/secrets/db
              readOnly: true
            - name: ses-smtp
              mountPath: /run/secrets/ses-smtp
              readOnly: true
            - name: blob-store
              mountPath: /run/secrets/blob-store
              readOnly: true
            - name: metrics
              mountPath: /run/secrets/metrics
              readOnly: true
            - name: tls
              mountPath: /run/secrets/tls
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            # A first estimate; the rehearsal measures it (ADR 0013).
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: stalwart
        - name: tmp
          emptyDir: {}
        - name: db-credentials
          secret:
            secretName: db-credentials
        - name: ses-smtp
          secret:
            secretName: ses-smtp
        - name: blob-store
          secret:
            secretName: blob-store
        - name: metrics
          secret:
            secretName: metrics
        # The certificate for mail.tosak.net, issued by cert-manager.
        - name: tls
          secret:
            secretName: mail-tls
        # stalwart-cli for the init container. An image volume is mounted
        # noexec, so the script runs a copy from /tmp.
        - name: stalwart-cli
          image:
            reference: stalwartlabs/cli:1.0.14@sha256:5b70732cb69cdab3ff0894c501544cf0bfa180fa75bcd0eeba4eebe04c1064e1
            pullPolicy: IfNotPresent
