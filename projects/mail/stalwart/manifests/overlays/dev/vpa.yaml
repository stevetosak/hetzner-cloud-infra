# The VerticalPodAutoscaler object of Stalwart; the overlay sets the namespace (ADR 0014).
# updateMode Off: the recommender writes a recommendation and nothing changes.
# Stalwart moves to InPlaceOrRecreate after 3 days of recommendations
# (Autoscaling Plan, decision of 2026-11-16).
# RequestsOnly: VPA sets requests, never limits. minAllowed is the ADR 0013
# floor (10m, 32Mi).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: stalwart
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stalwart
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 32Mi}
