apiVersion: apps/v1
kind: Deployment
metadata:
  name: authos-demo
  labels:
    app: authos-demo
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: authos-demo
  template:
    metadata:
      labels:
        app: authos-demo
    spec:
      containers:
        - name: authos-demo
          image: stevetosak/authos-demo
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          # entrypoint.sh renders config/config.js from these at container start.
          # DEMO_DUSTER_CLIENT_ID is a public OAuth client_id (minted by
          # authos-demo/scripts/bootstrap.ts), not a secret — it ships in the ConfigMap.
          envFrom:
            - configMapRef:
                name: authos-demo-config
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
  strategy:
    type: Recreate
