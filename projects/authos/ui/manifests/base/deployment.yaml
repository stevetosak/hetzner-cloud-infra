apiVersion: apps/v1
kind: Deployment
metadata:
  name: authos-ui
  labels:
    app: authos-ui
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: authos-ui
  template:
    metadata:
      name: authos-ui
      labels:
        app: authos-ui
    spec:
      containers:
        - name: authos-ui
          image: stevetosak/authos-ui
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: authos-ui-config
          # Sized by ADR 0013 from the 2026-11-01..05 peaks (Capacity Plan Snapshots 0 and 1).
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
  strategy:
    type: Recreate
      