# Template only — documents the shape. The real Secret is committed encrypted
# as keystore-pass.enc.yaml and applied with scripts/secrets.sh (ADR 0003).
#
# The password of the `keystore` Secret's PKCS#12 file. authos-api reads it
# through envFrom. Check it opens the file before encrypting either one:
#
#   keytool -list -keystore /etc/keystore/authos-cluster-keystore.p12 -storetype PKCS12
#
# The list must show `authos-jwt-sign` and `authos-credentials-encrypt`.
apiVersion: v1
kind: Secret
metadata:
  name: keystore-pass
  namespace: authos
type: Opaque
stringData:
  KEYSTORE_PASS: ""
