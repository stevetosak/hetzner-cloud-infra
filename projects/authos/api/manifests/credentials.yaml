# Template only — documents the shape. The real Secret is committed encrypted
# as credentials.enc.yaml and applied with scripts/secrets.sh (ADR 0003).
#
# Read by authos-api (envFrom) and by duster (REDIS_PASS, as REDIS_PASSWORD).
#
#   DB_USER     always `tosak`, the role that owns every database (ADR 0007)
#   DB_PASS     a copy of pg-cluster/db-credentials .password
#   REDIS_PASS  a copy of redis/redis .password
#
# 🔴 Both passwords are COPIES of a Secret in another namespace. Rotating the
# source alone leaves authos and duster on the old value until they restart and
# fail. Rotate the source and credentials.enc.yaml in the same commit.
apiVersion: v1
kind: Secret
metadata:
  name: credentials
  namespace: authos
type: Opaque
stringData:
  DB_USER: tosak
  DB_PASS: ""
  REDIS_PASS: ""
