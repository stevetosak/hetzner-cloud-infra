# Template only — documents the shape. The real Secret is committed encrypted
# as keystore.enc.yaml and applied with scripts/secrets.sh (ADR 0003).
#
# The PKCS#12 keystore that holds Authos's keys. authos-api mounts it at
# /etc/keystore/keystore.p12 with `subPath: keystore.p12`, so the key name
# below is load-bearing. It must hold two aliases, or CryptoConfig.kt stops the
# API at boot:
#
#   authos-jwt-sign             RSA key + certificate that sign every ID token
#   authos-credentials-encrypt  the secret key that encrypts stored credentials
#
# 🔴 There is no other copy in the cluster and none in git. Losing the file
# invalidates every token Authos has issued and every credential it encrypted.
# Its password is in the `keystore-pass` Secret.
#
# The source file on the operator's machine is
# /etc/keystore/authos-cluster-keystore.p12 (2025-12-28), NOT the older
# /etc/keystore/keystore.p12 beside it, which lacks the two aliases. Encrypt it
# with:
#
#   kubectl create secret generic keystore -n authos \
#     --from-file=keystore.p12=/etc/keystore/authos-cluster-keystore.p12 \
#     --dry-run=client -o yaml \
#     | scripts/secrets.sh encrypt projects/authos/api/manifests/keystore.enc.yaml
apiVersion: v1
kind: Secret
metadata:
  name: keystore
  namespace: authos
type: Opaque
data:
  keystore.p12: ""
