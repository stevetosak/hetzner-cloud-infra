apiVersion: apps/v1
kind: Deployment
metadata:
  name: authos-api
  labels:
    app: authos-api
  annotations:
    # Reloader restarts this Deployment when a Secret it reads changes (core/reloader).
    secret.reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: authos-api
  template:
    metadata:
      labels:
        app: authos-api
    spec:
      containers:
        - name: authos-api
          image: stevetosak/authos-api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: keystore
              mountPath: "/etc/keystore/keystore.p12"
              subPath: keystore.p12
              readOnly: true
          envFrom:
            - configMapRef:
                name: authos-api-config
            - secretRef:
                name: credentials
            - secretRef:
                name: keystore-pass

          # Sized by ADR 0013 from the 2026-11-01..05 peaks (Capacity Plan Snapshots 0 and 1).
          resources:
            requests:
              cpu: 39m
              memory: 400Mi
            limits:
              memory: 800Mi

      volumes:
        - name: keystore
          secret:
            secretName: keystore
  strategy:
    type: Recreate



