# authos.tosak.net, authos-api.tosak.net and authos-demo.tosak.net (ADR 0008).
# Replaces projects/authos/ingress.yaml.
#
# 🔴 No URLRewrite filter, on purpose. The Ingress carried
# `nginx.ingress.kubernetes.io/rewrite-target: /`, and `ingress2gateway` turns
# that into a `ReplacePrefixMatch: /` filter. The annotation was **inert**:
# ingress-nginx skips the rewrite when the path equals the target, and every
# path in the old object was `/`. Gateway API passes the path through
# unchanged, which is the behaviour that was actually live.
#
# The TLS block is gone. The Gateway holds one wildcard certificate, so
# `authos-tls` in this namespace no longer exists.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authos
  namespace: authos
spec:
  parentRefs:
    - name: tosak
      namespace: gateway
      sectionName: https
  hostnames:
    - authos.tosak.net
  rules:
    - backendRefs:
        - name: authos-ui
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authos-api
  namespace: authos
spec:
  parentRefs:
    - name: tosak
      namespace: gateway
      sectionName: https
  hostnames:
    - authos-api.tosak.net
  rules:
    - backendRefs:
        - name: authos-api
          port: 80
---
# authos-demo.tosak.net. Kept in this file with the other authos routes, one
# route file per project like every other project.
#
# `/duster` reaches the Duster Service with its path INTACT, so from the
# browser Duster is same-origin: no CORS, a `SameSite=Lax` cookie, and
# `Secure` satisfied by the Gateway's TLS.
#
# The old comment here justified a separate Ingress object by saying
# `authos-lb-ingress` rewrites and this one must not. That was **wrong about a
# behaviour that never happened**: the rewrite annotation was inert, because
# every path in that object equalled the rewrite target. Under Gateway API the
# path passes through unchanged by default, so there is nothing to defend
# against — this is a separate object now only because it is a separate host.
#
# Rule order does not matter. Gateway API ranks matches by specificity, so the
# longer prefix `/duster` wins over `/` regardless of the order written.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authos-demo
  namespace: authos
  labels:
    app: authos-demo
spec:
  parentRefs:
    - name: tosak
      namespace: gateway
      sectionName: https
  hostnames:
    - authos-demo.tosak.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /duster
      backendRefs:
        - name: duster
          port: 8785
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authos-demo
          port: 80
