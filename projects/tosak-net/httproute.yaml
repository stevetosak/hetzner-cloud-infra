# tosak.net serves the landing page; www.tosak.net sends visitors to it.
#
# Hostnames belong to a route, not to a rule, so `www` needs a route of its
# own. 302, not 301, until the page is stable: a browser caches a 301 with no
# end date. The redirect keeps the path.
#
# Until 2026-11-14 the route `apex-to-docs` in the gateway namespace sent both
# hosts to docs.tosak.net. A host claimed by two routes goes to the older one,
# so that route was deleted by hand when these took over.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tosak-net
  namespace: tosak-net
  labels:
    app: tosak-net-site
spec:
  parentRefs:
    - name: tosak
      namespace: gateway
      sectionName: https
  hostnames:
    - tosak.net
  rules:
    - backendRefs:
        - name: tosak-net-site
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tosak-net-www
  namespace: tosak-net
  labels:
    app: tosak-net-site
spec:
  parentRefs:
    - name: tosak
      namespace: gateway
      sectionName: https
  hostnames:
    - www.tosak.net
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: tosak.net
            statusCode: 302
