# The landing page of tosak.net: the static Astro build behind unprivileged
# nginx (the image is built in stevetosak/tosak-net, apps/site/Dockerfile).
# No ConfigMap and no Secret: the page reads nothing at run time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tosak-net-site
  labels:
    app: tosak-net-site
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: tosak-net-site
  # Rolling, not the template's Recreate: the pod holds no state and runs no
  # migration, and the apex is probed every minute, so a deploy keeps the old
  # pod serving until the new one is ready.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tosak-net-site
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tosak-net-site
          image: stevetosak/tosak-net-site
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # nginx answers both without reading a file; the page has no dependency.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          # The first guess of ADR 0013; resized from three days of data.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
